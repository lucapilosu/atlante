<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilu Sports Almanac</title>
<link rel="icon" href="../favicon-32.png">
<style>
:root{--bg:#0e191d;--bg2:#13232a;--panel:#172b32;--line:#25404a;--text:#ece6d6;--muted:#8fa6ad;--accent:#f0b44c;--gut:58px;--top:52px;--head:44px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.bar{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:30}
.bar .back{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.bar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bar h1 .anni{color:var(--accent);font-weight:700;margin-left:.35em}
.bar .btn{background:#1f3740;border:1px solid var(--line);border-radius:8px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font-size:14px}
.bar .btn:hover{background:#27454f}
#stage{position:fixed;left:0;right:0;top:var(--top);bottom:0;overflow:hidden;touch-action:none;cursor:grab;background:
 radial-gradient(ellipse at 50% 0%,#14262d,var(--bg) 70%)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.colbg{position:absolute;top:0;border-left:1px solid rgba(255,255,255,.04)}
.colbg.alt{background:rgba(255,255,255,.018)}
.guide{position:absolute;width:2px;border-radius:2px;opacity:.35}
.decade{position:absolute;left:0;height:1px;background:rgba(255,255,255,.05)}
.band{position:absolute;left:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 10px,transparent 10px 20px);border-top:1px dashed rgba(240,180,76,.35)}
.band span{position:absolute;left:10px;top:8px;font-size:22px;font-weight:700;color:rgba(240,180,76,.55);letter-spacing:.04em}
.pin{position:absolute;width:9px;height:9px;border-radius:50%;margin:-4.5px 0 0 -4.5px;border:2px solid var(--bg)}
.link{position:absolute;height:1px;opacity:.5}
.tile{position:absolute;width:180px;height:76px;padding:7px 9px 7px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line);border-left-width:5px;cursor:pointer;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tile:hover{background:#1d3640}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile .y{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.tile .t{font-size:14px;font-weight:650;line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ita{position:absolute;right:7px;top:8px;width:18px;height:5px;border-radius:2px;background:linear-gradient(90deg,#1f9c4b 0 33%,#fff 33% 66%,#d23a3a 66%)}
#world.far .tile .t{display:none}
#world.far .tile .y{font-size:22px;margin-top:6px}
#heads{position:fixed;left:var(--gut);right:0;top:var(--top);height:var(--head);z-index:20;overflow:hidden;pointer-events:none;background:linear-gradient(var(--bg2),rgba(19,35,42,.92));border-bottom:1px solid var(--line)}
.head{position:absolute;top:0;height:var(--head);display:flex;align-items:center;gap:6px;padding:0 8px;pointer-events:auto;cursor:pointer;border-top:4px solid;white-space:nowrap;overflow:hidden}
.head:hover{background:rgba(255,255,255,.05)}
.head svg{flex:none;width:22px;height:22px}
.head b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.head .albo{font-size:10px;color:var(--accent);border:1px solid rgba(240,180,76,.5);border-radius:4px;padding:0 4px}
#gutter{position:fixed;left:0;top:var(--top);bottom:0;width:var(--gut);z-index:19;overflow:hidden;pointer-events:none;background:linear-gradient(90deg,var(--bg2) 70%,rgba(19,35,42,0))}
#gutter span{position:absolute;left:6px;font-size:12px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
#gutter span.b{color:var(--text);font-weight:700}
#gutter .corner{position:absolute;left:0;top:0;width:var(--gut);height:var(--head);background:var(--bg2);border-bottom:1px solid var(--line)}
/* scheda */
#panel{position:fixed;z-index:40;background:var(--bg2);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.35);overflow:auto;-webkit-overflow-scrolling:touch;right:0;top:var(--top);bottom:0;width:min(440px,100vw);transform:translateX(105%);transition:transform .22s ease-out}
#panel.open{transform:none}
@media (max-width:700px){
 #panel{left:0;right:0;top:auto;width:auto;height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
 #panel.open{transform:none}
 .bar h1{font-size:14px}
 .bar{gap:6px;padding:0 8px}
 .bar .btn{padding:0 8px;font-size:13px}
 .lungo{display:none}
 .bar .back{display:none}
 .bar .btn.z{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
.pin-close{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px 16px;background:var(--bg2);z-index:1}
.pin-close button{background:#1f3740;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 6px;border-radius:999px;background:#1f3740;cursor:pointer;border:0}
.chip svg{width:16px;height:16px}
.body{padding:2px 16px 24px}
.body h2{margin:6px 0 2px;font-size:21px;line-height:1.2}
.meta{color:var(--accent);font-weight:600;font-size:14px}
.meta .luogo{color:var(--muted);font-weight:400}
.body p{margin:10px 0}
.body h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.fonti{margin:0;padding-left:18px;font-size:13.5px}
.fonti li{margin:3px 0}
.fonti .ist{color:var(--muted)}
.nota{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:10px 0}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:#1f3740;margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{border:1px solid var(--line);background:#1f3740;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--accent);color:#1b1b1b;border-color:var(--accent);font-weight:700}
table.albo{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.albo col.c-a{width:62px}table.albo col.c-r{width:58px}
table.albo td{overflow-wrap:anywhere}
table.albo th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 4px;border-bottom:1px solid var(--line);position:sticky;top:50px;background:var(--bg2)}
table.albo td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
table.albo td.a{font-weight:700;color:var(--accent);white-space:nowrap}
table.albo td.r{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
table.albo td .sede{display:block;color:var(--muted);font-size:11.5px}
table.albo tr.ita td{background:rgba(31,156,75,.12)}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.lista li:hover{color:var(--accent)}
.lista .ly{width:58px;flex:none;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.albi-lista button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#1f3740;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.albi-lista svg{width:26px;height:26px;flex:none}
.foot{font-size:12px;color:var(--muted);margin-top:22px}
.hint{position:fixed;left:50%;bottom:16px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);z-index:25;background:rgba(19,35,42,.95);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--muted);pointer-events:none;transition:opacity .4s}
.hint.off{opacity:0}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../">← Atlante</a>
  <h1 id="titolo">Pilu Sports Almanac<span class="anni"></span></h1>
  <button class="btn" id="bAlbi" type="button" title="Albi d'oro">Albi<span class="lungo"> d'oro</span></button>
  <button class="btn z" id="bMeno" type="button" title="Allontana" aria-label="Allontana">−</button>
  <button class="btn z" id="bPiu" type="button" title="Avvicina" aria-label="Avvicina">+</button>
  <button class="btn" id="bTutto" type="button" title="Tutto l'almanacco">Tutto</button>
</header>
<div id="stage" aria-label="Mosaico degli sport: trascina per muoverti, rotella o due dita per lo zoom"><div id="world"></div></div>
<div id="heads"></div>
<div id="gutter"><div class="corner"></div></div>
<aside id="panel" aria-live="polite"></aside>
<div class="hint" id="hint">Trascina<span class="lungo"> per muoverti</span> · tocca una tessera · tocca uno sport per l'albo</div>
<script>
const DATI = {"sport":[{"id":"olimpiadi","nome":"Olimpiadi e mondo","colore":"#c8a85a","icona":"globo"},{"id":"basket","nome":"Basket","colore":"#e2772f","icona":"basket"},{"id":"pallavolo","nome":"Pallavolo","colore":"#3f8fdc","icona":"volley"},{"id":"beach","nome":"Beach volley","colore":"#e8c24a","icona":"beach"},{"id":"atletica","nome":"Atletica","colore":"#d4574f","icona":"pista"},{"id":"calcio","nome":"Calcio","colore":"#3fae62","icona":"calcio"},{"id":"ciclismo","nome":"Ciclismo","colore":"#e3699f","icona":"bici"},{"id":"tennis","nome":"Tennis","colore":"#b7d33f","icona":"tennis"},{"id":"motori","nome":"Motori","colore":"#9aa3ad","icona":"scacchi"},{"id":"sci","nome":"Sci","colore":"#8fd6f6","icona":"sci"},{"id":"nuoto","nome":"Nuoto","colore":"#2fb7b3","icona":"onde"}],"voci":[{"id":"olimpia","sport":"olimpiadi","anno":-776,"data":"","circa":true,"titolo":"I Giochi di Olimpia","testo":"Nel santuario di Zeus a Olimpia, nel Peloponneso, si tengono i Giochi più famosi della Grecia antica. La data del 776 a.C. è quella che citano di solito le fonti scritte; i Giochi si svolgono ogni quattro anni fino al 393 d.C.","luogo":"Olimpia (Grecia)","fonti":[{"i":"olympics.com","t":"What is the origin of the Olympic Games?","u":"https://www.olympics.com/ioc/faq/history-and-origin-of-the-games/what-is-the-origin-of-the-olympic-games"},{"i":"olympics.com","t":"Athens 1896 - 125 years of shared Olympic values","u":"https://www.olympics.com/ioc/news/athens-1896-125-years-of-shared-olympic-values"}],"italia":false,"nota":"Il CIO scrive che la data esatta d'inizio non si conosce: il 776 a.C. è la data tradizionale."},{"id":"calcio-fa","sport":"calcio","anno":1863,"data":"26 ottobre 1863","circa":false,"titolo":"Le prime regole del calcio","testo":"Il 26 ottobre 1863, alla Freemasons' Tavern di Londra, i rappresentanti di una dozzina di club fondano la Football Association e scrivono le prime regole comuni del gioco.","luogo":"Londra","fonti":[{"i":"The FA","t":"The History of The FA","u":"https://www.thefa.com/about-football-association/who-we-are/history"},{"i":"Britannica","t":"Football Association (FA)","u":"https://www.britannica.com/topic/Football-Association"}],"italia":false,"nota":""},{"id":"tennis-wimbledon","sport":"tennis","anno":1877,"data":"","circa":false,"titolo":"Il primo Wimbledon","testo":"Nel luglio 1877 l'All England Croquet and Lawn Tennis Club organizza il primo torneo di tennis su prato: 22 iscritti, solo il singolare maschile. Vince Spencer Gore.","luogo":"Londra, Wimbledon","fonti":[{"i":"Britannica","t":"Tennis","u":"https://www.britannica.com/sports/tennis"},{"i":"Wimbledon","t":"The Championships 1877 Gentlemen's Singles","u":"https://assets.wimbledon.com/archive/draws/pdfs/draws/1877_MS_A4.pdf"}],"italia":false,"nota":""},{"id":"basket-naismith","sport":"basket","anno":1891,"data":"21 dicembre 1891","circa":false,"titolo":"Naismith inventa il basket","testo":"James Naismith, insegnante di educazione fisica alla scuola della YMCA di Springfield, nel Massachusetts, inventa un gioco da palestra per l'inverno. La prima partita si gioca il 21 dicembre 1891, con due cesti da pesche come canestri.","luogo":"Springfield (Massachusetts, USA)","fonti":[{"i":"Britannica","t":"Basketball","u":"https://www.britannica.com/sports/basketball"},{"i":"Naismith Basketball Hall of Fame","t":"First Team","u":"https://www.hoophall.com/hall-of-famers/first-team"}],"italia":false,"nota":""},{"id":"cio-1894","sport":"olimpiadi","anno":1894,"data":"23 giugno 1894","circa":false,"titolo":"Nasce il Comitato olimpico internazionale","testo":"Il 23 giugno 1894, alla Sorbona di Parigi, un congresso organizzato da Pierre de Coubertin approva all'unanimità il ritorno dei Giochi olimpici. È la nascita del CIO.","luogo":"Parigi, Sorbona","fonti":[{"i":"olympics.com","t":"International Olympic Committee","u":"https://www.olympics.com/ioc/overview"},{"i":"olympics.com","t":"factsheet - Olympic Day (23 June)","u":"https://stillmed.olympics.com/media/Documents/Beyond-the-Games/Factsheets/Olympic-Day.pdf"}],"italia":false,"nota":""},{"id":"volley-morgan","sport":"pallavolo","anno":1895,"data":"","circa":false,"titolo":"Morgan inventa la pallavolo","testo":"William G. Morgan, direttore sportivo della YMCA di Holyoke, nel Massachusetts, inventa un gioco meno faticoso del basket e lo chiama «mintonette». Presto diventerà volleyball.","luogo":"Holyoke (Massachusetts, USA)","fonti":[{"i":"FIVB","t":"History","u":"https://www.fivb.com/volleyball/the-game/history/"},{"i":"Britannica","t":"Who invented volleyball?","u":"https://www.britannica.com/question/Who-invented-volleyball"}],"italia":false,"nota":""},{"id":"atene-1896","sport":"olimpiadi","anno":1896,"data":"6–15 aprile 1896","circa":false,"titolo":"Atene 1896, la prima Olimpiade moderna","testo":"Dal 6 al 15 aprile 1896 Atene ospita i primi Giochi dell'era moderna, nello Stadio Panatenaico: oltre 300 atleti, tutti uomini, in 43 gare di 9 sport.","luogo":"Atene, Stadio Panatenaico","fonti":[{"i":"olympics.com","t":"Athens 1896","u":"https://www.olympics.com/en/sport-events/athens-1896"},{"i":"olympics.com","t":"The Opening Ceremony","u":"https://www.olympics.com/en/news/the-opening-ceremony"}],"italia":false,"nota":""},{"id":"parigi-1900-donne","sport":"olimpiadi","anno":1900,"data":"","circa":false,"titolo":"Parigi 1900: le prime donne ai Giochi","testo":"Ai Giochi di Parigi, legati all'Esposizione universale, gareggiano per la prima volta le donne: 22 su 997 atleti. La tennista britannica Charlotte Cooper è la prima campionessa olimpica in una gara individuale.","luogo":"Parigi","fonti":[{"i":"olympics.com","t":"The first women Olympians","u":"https://www.olympics.com/en/news/the-first-women-olympians"},{"i":"olympics.com","t":"Paris 1900 Summer Olympics","u":"https://www.olympics.com/en/olympic-games/paris-1900"}],"italia":false,"nota":""},{"id":"tennis-davis","sport":"tennis","anno":1900,"data":"","circa":false,"titolo":"Nasce la Coppa Davis","testo":"Nel 1900 Stati Uniti e Gran Bretagna si sfidano per un trofeo comprato da Dwight Davis: nasce la Coppa Davis, oggi la più grande competizione annuale a squadre nazionali.","luogo":"Boston (USA)","fonti":[{"i":"Davis Cup","t":"History","u":"https://www.daviscup.com/en/about/history"},{"i":"Britannica","t":"Davis Cup","u":"https://www.britannica.com/sports/Davis-Cup"}],"italia":false,"nota":""},{"id":"calcio-fifa","sport":"calcio","anno":1904,"data":"21 maggio 1904","circa":false,"titolo":"Nasce la FIFA","testo":"Il 21 maggio 1904 a Parigi i rappresentanti di sette federazioni europee fondano la Federazione internazionale del calcio.","luogo":"Parigi","fonti":[{"i":"FIFA","t":"FIFA celebrates 119th birthday","u":"https://inside.fifa.com/organisation/news/fifa-celebrates-119th-birthday"},{"i":"FIFA","t":"Happy birthday FIFA!","u":"https://www.fifa.com/who-we-are/news/happy-birthday-fifa-772772"}],"italia":false,"nota":""},{"id":"nuoto-fina","sport":"nuoto","anno":1908,"data":"19 luglio 1908","circa":false,"titolo":"Nasce la FINA","testo":"Il 19 luglio 1908, durante le Olimpiadi di Londra, otto federazioni fondano la Federazione internazionale del nuoto (oggi World Aquatics).","luogo":"Londra","fonti":[{"i":"World Aquatics","t":"Overview and history","u":"https://www.worldaquatics.com/content/overview-and-history"}],"italia":false,"nota":""},{"id":"ciclismo-giro-1909","sport":"ciclismo","anno":1909,"data":"13 maggio 1909","circa":false,"titolo":"Il primo Giro d'Italia","testo":"Il 13 maggio 1909 parte da Milano il primo Giro d'Italia, organizzato dalla Gazzetta dello Sport: 8 tappe e 2.448 km. Vince Luigi Ganna.","luogo":"Milano","fonti":[{"i":"Giro d'Italia","t":"Giro d'Italia: tutte le edizioni storiche 1909-1922","u":"https://archivio.giroditalia.it/it/edizioni/1909-1922/"},{"i":"Giro d'Italia","t":"Ricordi da… Torino, 1909: il primo Giro","u":"https://www.giroditalia.it/news/ricordi-da-torino-1909-il-primo-giro-e-il-cortese-inganno/"}],"italia":true,"nota":""},{"id":"atletica-iaaf","sport":"atletica","anno":1912,"data":"17 luglio 1912","circa":false,"titolo":"Nasce la federazione mondiale","testo":"Il 17 luglio 1912, a Stoccolma, 17 federazioni fondano la IAAF (oggi World Athletics) per avere regole comuni e un elenco ufficiale dei record del mondo.","luogo":"Stoccolma","fonti":[{"i":"World Athletics","t":"Early origins to 1930s","u":"https://worldathletics.org/heritage/history/early-origins-to-1930s"}],"italia":false,"nota":""},{"id":"beach-santa-monica","sport":"beach","anno":1920,"data":"","circa":true,"titolo":"Due contro due a Santa Monica","testo":"Sulle spiagge della California, e soprattutto a Santa Monica, negli anni Venti nasce il gioco a due per squadra. Il primo torneo si gioca alla fine degli anni Quaranta.","luogo":"Santa Monica (California, USA)","fonti":[{"i":"olympics.com","t":"Beach Volleyball","u":"https://www.olympics.com/en/sports/beach-volleyball/"},{"i":"Britannica","t":"Beach volleyball","u":"https://www.britannica.com/sports/beach-volleyball"}],"italia":false,"nota":"Le fonti non concordano: olympics.com indica il 1920 per il gioco a due e il 1947 per il primo torneo; Britannica indica il 1930 e il 1948 (Will Rogers State Beach)."},{"id":"motori-le-mans","sport":"motori","anno":1923,"data":"26–27 maggio 1923","circa":false,"titolo":"La prima 24 Ore di Le Mans","testo":"Il 26 e 27 maggio 1923 33 auto partono per la prima corsa di 24 ore sul circuito di Le Mans. Vincono André Lagache e René Léonard su Chenard & Walcker.","luogo":"Le Mans (Francia)","fonti":[{"i":"24h Le Mans","t":"A century of racing: the 24 Hours of Le Mans is 100 years old!","u":"https://www.24h-lemans.com/en/news/a-century-of-racing-the-24-hours-of-le-mans-is-100-years-old-57463"},{"i":"24h Le Mans","t":"First winner of the 24 Hours of Le Mans","u":"https://www.24h-lemans.com/en/news/first-winner-of-the-24-hours-of-le-mans-who-was-rene-leonard-andre-lagaches-teammate-50683"}],"italia":false,"nota":""},{"id":"chamonix-1924","sport":"olimpiadi","anno":1924,"data":"25 gennaio – 5 febbraio 1924","circa":false,"titolo":"Chamonix 1924, i primi Giochi invernali","testo":"Dal 25 gennaio al 5 febbraio 1924 Chamonix ospita una «Settimana internazionale degli sport invernali» con 258 atleti di 16 paesi. Nel 1926 il CIO la riconosce come prima edizione dei Giochi olimpici invernali.","luogo":"Chamonix (Francia)","fonti":[{"i":"olympics.com","t":"When were the first Olympic Winter Games held?","u":"https://www.olympics.com/ioc/faq/history-and-origin-of-the-games/when-were-the-first-olympic-winter-games-held"},{"i":"olympics.com","t":"Chamonix 1924 Winter Olympics","u":"https://www.olympics.com/en/olympic-games/chamonix-1924"}],"italia":false,"nota":""},{"id":"sci-fis","sport":"sci","anno":1924,"data":"2 febbraio 1924","circa":false,"titolo":"Nasce la FIS","testo":"Il 2 febbraio 1924, durante i Giochi di Chamonix, 14 nazioni fondano la Federazione internazionale dello sci, erede della commissione nata a Christiania (Oslo) nel 1910.","luogo":"Chamonix (Francia)","fonti":[{"i":"FIS","t":"History of FIS","u":"https://www.fis-ski.com/en/inside-fis/about-fis/history/history-of-fis"}],"italia":false,"nota":""},{"id":"calcio-mondiale-1930","sport":"calcio","anno":1930,"data":"","circa":false,"titolo":"Il primo Mondiale","testo":"In Uruguay si gioca il primo Campionato del mondo, con 13 squadre. Il 30 luglio, a Montevideo, l'Uruguay batte l'Argentina 4-2 in finale.","luogo":"Montevideo","fonti":[{"i":"FIFA","t":"FIFA World Cup champions: 1930-1978","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/world-cup-champions-1930-1978-uruguay-italy-germany-brazil-england-argentina"}],"italia":false,"nota":""},{"id":"ciclismo-maglia-rosa","sport":"ciclismo","anno":1931,"data":"","circa":false,"titolo":"Nasce la maglia rosa","testo":"Nel 1931 Armando Cougnet, giornalista della Gazzetta dello Sport, introduce una maglia rosa per riconoscere subito il primo della classifica.","luogo":"","fonti":[{"i":"Giro d'Italia","t":"90 Years of the Maglia Rosa","u":"https://www.giroditalia.it/en/magliarosa/"}],"italia":true,"nota":""},{"id":"sci-murren-1931","sport":"sci","anno":1931,"data":"20–23 febbraio 1931","circa":false,"titolo":"I primi Mondiali di sci alpino","testo":"Dal 20 al 23 febbraio 1931 Mürren, in Svizzera, ospita i primi Mondiali di sci alpino: discesa e slalom, maschili e femminili. Tra i paesi in gara c'è anche l'Italia.","luogo":"Mürren (Svizzera)","fonti":[{"i":"FIS","t":"Where it all began: Mürren 1931","u":"https://100.fis-ski.com/moments/where-it-all-began-muerren-1931"}],"italia":false,"nota":""},{"id":"basket-fiba","sport":"basket","anno":1932,"data":"18 giugno 1932","circa":false,"titolo":"Nasce la FIBA","testo":"Il 18 giugno 1932, a Ginevra, otto federazioni nazionali (Argentina, Cecoslovacchia, Grecia, Italia, Lettonia, Portogallo, Romania e Svizzera) fondano la Federazione internazionale di basket e approvano regole comuni.","luogo":"Ginevra (Svizzera)","fonti":[{"i":"FIBA","t":"FIBA celebrates 85th anniversary","u":"https://www.fiba.basketball/en/news/fiba-celebrates-85th-anniversary"},{"i":"FIBA","t":"8 Founding Federations","u":"https://about.fiba.basketball/en/fiba-hall-of-fame/hall-of-famers/8-founding-federations"}],"italia":true,"nota":""},{"id":"calcio-italia-1934","sport":"calcio","anno":1934,"data":"","circa":false,"titolo":"Italia campione del mondo","testo":"L'Italia di Vittorio Pozzo vince il Mondiale di casa battendo la Cecoslovacchia 2-1 ai supplementari a Roma. Nel 1938, in Francia, rivince: è la prima squadra a confermarsi campione.","luogo":"Roma","fonti":[{"i":"FIFA","t":"FIFA World Cup champions: 1930-1978","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/world-cup-champions-1930-1978-uruguay-italy-germany-brazil-england-argentina"},{"i":"FIFA","t":"The back-to-back champions","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/italy-brazil-consecutive-titles"}],"italia":true,"nota":""},{"id":"basket-berlino-1936","sport":"basket","anno":1936,"data":"","circa":false,"titolo":"Il basket arriva alle Olimpiadi","testo":"A Berlino il basket entra nel programma olimpico. Si gioca all'aperto su campi in terra: la finale si disputa sotto la pioggia e gli Stati Uniti battono il Canada 19-8.","luogo":"Berlino","fonti":[{"i":"olympics.com","t":"Olympic basketball's muddy beginnings","u":"https://www.olympics.com/en/news/olympic-basketball-s-muddy-beginnings"},{"i":"FIBA","t":"Olympic Games: Berlin 1936","u":"https://www.fiba.basketball/en/news/olympic-games-berlin-1936"}],"italia":false,"nota":""},{"id":"basket-nba","sport":"basket","anno":1946,"data":"","circa":false,"titolo":"Nasce la lega che diventerà la NBA","testo":"Nel 1946 a New York nasce la Basketball Association of America, che gioca la prima partita il 1° novembre. Nel 1949 si fonde con la National Basketball League: nasce la NBA.","luogo":"New York","fonti":[{"i":"Britannica","t":"National Basketball Association (NBA)","u":"https://www.britannica.com/topic/National-Basketball-Association"},{"i":"NBA","t":"About the NBA","u":"https://www.nba.com/news/about"}],"italia":false,"nota":""},{"id":"volley-fivb","sport":"pallavolo","anno":1947,"data":"","circa":false,"titolo":"Nasce la FIVB","testo":"Nell'aprile 1947 a Parigi quattordici federazioni, tra cui l'Italia, fondano la Federazione internazionale di pallavolo. Dal 1984 ha sede a Losanna.","luogo":"Parigi","fonti":[{"i":"FIVB","t":"Volleyball's Century: The FIVB Legacy","u":"https://www.fivb.com/inside-fivb/fivb/history/"},{"i":"FIVB","t":"Volleyball History - Men's World Cup 2015","u":"http://worldcup.2015.men.fivb.com/en/competition/volleyballhistory"}],"italia":true,"nota":""},{"id":"volley-mondiale-1949","sport":"pallavolo","anno":1949,"data":"","circa":false,"titolo":"Il primo Mondiale","testo":"A settembre Praga ospita il primo Campionato del mondo maschile: vince l'Unione Sovietica davanti a Cecoslovacchia e Bulgaria. Il Mondiale femminile arriverà nel 1952.","luogo":"Praga","fonti":[{"i":"Volleyball World","t":"Men's World Championship by the numbers","u":"https://en.volleyballworld.com/volleyball/competitions/men-world-championship/2022/news/men-s-world-championship-by-the-numbers"},{"i":"FIVB","t":"Volleyball's Century: The FIVB Legacy","u":"https://www.fivb.com/inside-fivb/fivb/history/"}],"italia":false,"nota":""},{"id":"motori-f1-1950","sport":"motori","anno":1950,"data":"13 maggio 1950","circa":false,"titolo":"Il primo Gran Premio di Formula 1","testo":"Il 13 maggio 1950 a Silverstone si corre la prima gara del Mondiale di Formula 1. Vince l'italiano Giuseppe «Nino» Farina su Alfa Romeo, che a fine anno sarà il primo campione del mondo.","luogo":"Silverstone (Inghilterra)","fonti":[{"i":"Formula 1","t":"Ten fascinating facts about the very first F1 race","u":"https://www.formula1.com/en/latest/article/f1-first-race-1950-silverstone.2f2zI6BmGT9bnK4vX10paZ"},{"i":"Formula 1","t":"Great Britain - Silverstone","u":"https://www.formula1.com/en/information/great-britain-silverstone-circuit.2DtFVI1FjkYgLVdGhbAIv0"}],"italia":true,"nota":""},{"id":"roma-1960-paralimpiadi","sport":"olimpiadi","anno":1960,"data":"18–25 settembre 1960","circa":false,"titolo":"Roma 1960, le prime Paralimpiadi","testo":"Dal 18 al 25 settembre 1960, sei giorni dopo la chiusura delle Olimpiadi, Roma ospita i primi Giochi paralimpici, organizzati da Ludwig Guttmann e dal neurochirurgo italiano Antonio Maglio.","luogo":"Roma","fonti":[{"i":"paralympic.org","t":"Rome 1960","u":"https://www.paralympic.org/rome-1960"},{"i":"paralympic.org","t":"Paralympic Games","u":"https://www.paralympic.org/paralympic-games"}],"italia":true,"nota":"Partecipanti: l'IPC indica 400 atleti da 23 paesi nella pagina generale e 319 atleti da 21 paesi nella pagina dedicata a Roma 1960; nel testo non c'è il numero."},{"id":"volley-tokyo-1964","sport":"pallavolo","anno":1964,"data":"","circa":false,"titolo":"La pallavolo diventa olimpica","testo":"A Tokyo 1964 la pallavolo debutta ai Giochi, maschile e femminile insieme. Vincono l'Unione Sovietica tra gli uomini e il Giappone tra le donne, che in finale batte proprio l'URSS.","luogo":"Tokyo","fonti":[{"i":"olympics.com","t":"Volleyball: a brief history","u":"https://www.olympics.com/en/news/volleyball-a-brief-history"},{"i":"olympics.com","t":"Bewitched: Japan's 1964 gold in women's volleyball","u":"https://www.olympics.com/en/news/tokyo-1964-women-volleyball-japan-gold"}],"italia":false,"nota":""},{"id":"sci-coppa-1967","sport":"sci","anno":1967,"data":"5 gennaio 1967","circa":false,"titolo":"Nasce la Coppa del Mondo","testo":"Il 5 gennaio 1967 a Berchtesgaden si corre la prima gara della Coppa del Mondo di sci alpino, nata da un'idea del giornalista francese Serge Lang. La prima stagione conta 17 gare.","luogo":"Berchtesgaden (Germania)","fonti":[{"i":"FIS","t":"Alpine World Cup turns 60","u":"https://www.fis-ski.com/alpine-skiing/news/2026-27/crystal-globes-prominent-calendars-wild-cards-confirmed-alpine-world-cup-turns-60"},{"i":"FIS","t":"The Ski World Cup, a success story","u":"https://100.fis-ski.com/moments/the-ski-world-cup-a-success-story"}],"italia":false,"nota":""},{"id":"tennis-open","sport":"tennis","anno":1968,"data":"","circa":false,"titolo":"Comincia l'era Open","testo":"Nel marzo 1968 la federazione internazionale approva i primi tornei aperti sia ai dilettanti sia ai professionisti: comincia l'era Open.","luogo":"","fonti":[{"i":"Britannica","t":"Tennis - Professional and open tennis","u":"https://www.britannica.com/sports/tennis/Professional-and-open-tennis"},{"i":"Britannica","t":"What Is the Open Era in Tennis?","u":"https://www.britannica.com/sports/What-Is-the-Open-Era-in-Tennis"}],"italia":false,"nota":""},{"id":"nuoto-mondiali-1973","sport":"nuoto","anno":1973,"data":"","circa":false,"titolo":"I primi Mondiali di nuoto","testo":"Nel 1973 Belgrado ospita i primi Campionati del mondo di nuoto, pallanuoto, tuffi e nuoto sincronizzato.","luogo":"Belgrado","fonti":[{"i":"World Aquatics","t":"Overview and history","u":"https://www.worldaquatics.com/content/overview-and-history"}],"italia":false,"nota":""},{"id":"basket-donne-1976","sport":"basket","anno":1976,"data":"","circa":false,"titolo":"Il basket femminile alle Olimpiadi","testo":"A Montréal 1976 debutta il torneo olimpico femminile: vince l'Unione Sovietica, che in finale batte gli Stati Uniti.","luogo":"Montréal (Canada)","fonti":[{"i":"FIBA","t":"Tokyo 2020 by numbers","u":"https://www.fiba.basketball/en/news/olympics-men-2020-news-tokyo-2020-by-numbers-stats-and-facts-from-the-olympic-basketball-tournaments"},{"i":"Wikipedia","t":"Basketball at the Summer Olympics (rev. 1383154364)","u":"https://en.wikipedia.org/w/index.php?title=Basketball_at_the_Summer_Olympics&oldid=1383154364"}],"italia":false,"nota":""},{"id":"tennis-davis-1976","sport":"tennis","anno":1976,"data":"","circa":false,"titolo":"Italia, prima Coppa Davis","testo":"A dicembre, a Santiago del Cile, l'Italia di Adriano Panatta e Corrado Barazzutti batte il Cile 4-1 e vince la sua prima Coppa Davis.","luogo":"Santiago del Cile","fonti":[{"i":"Davis Cup","t":"Previous Champions","u":"https://www.daviscup.com/en/previous-champions"},{"i":"Davis Cup","t":"Italy Davis Cup team profile","u":"https://www.daviscup.com/en/news/italy-team-profile-article"}],"italia":true,"nota":""},{"id":"calcio-italia-1982","sport":"calcio","anno":1982,"data":"11 luglio 1982","circa":false,"titolo":"Campioni del mondo in Spagna","testo":"L'11 luglio 1982, al Bernabéu di Madrid, l'Italia batte la Germania Ovest 3-1 e vince il suo terzo Mondiale, il primo dal 1938.","luogo":"Madrid","fonti":[{"i":"FIFA","t":"FIFA World Cup champions: 1982-2026","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/world-cup-champions-1982-2026-italy-argentina-germany-brazil-france-spain"}],"italia":true,"nota":""},{"id":"atletica-mondiali-1983","sport":"atletica","anno":1983,"data":"7–14 agosto 1983","circa":false,"titolo":"I primi Mondiali di atletica","testo":"Dal 7 al 14 agosto 1983 Helsinki ospita i primi Campionati del mondo: 1.355 atleti da 153 paesi. Fino ad allora il titolo mondiale era, di fatto, quello olimpico.","luogo":"Helsinki","fonti":[{"i":"World Athletics","t":"1980s to end of 20th Century","u":"https://worldathletics.org/heritage/history/1980s-to-end-of-20th-century"},{"i":"World Athletics","t":"History of the World Athletics Championships","u":"https://worldathletics.org/en/competitions/world-athletics-championships/world-athletics-championships-tokyo-2025-7190593/event-info/world-athletics-history"}],"italia":false,"nota":""},{"id":"basket-euro-1983","sport":"basket","anno":1983,"data":"","circa":false,"titolo":"Italia campione d'Europa","testo":"Agli Europei in Francia l'Italia di Sandro Gamba vince tutte le sette partite e conquista il suo primo titolo europeo; in finale c'è la Spagna.","luogo":"Francia (Limoges, Caen, Nantes)","fonti":[{"i":"FIBA","t":"All-Time Medalists - FIBA EuroBasket","u":"https://www.fiba.basketball/en/events/fiba-eurobasket-2025/all-time-medalists"},{"i":"FIBA","t":"Top Five Italy Teams of All Time","u":"https://www.fiba.basketball/en/news/top-five-italy-teams-all-time"}],"italia":true,"nota":""},{"id":"beach-fivb-1987","sport":"beach","anno":1987,"data":"","circa":false,"titolo":"Il primo torneo FIVB","testo":"Nel 1987 si gioca il primo torneo di beach volley riconosciuto dalla federazione internazionale. Nove anni dopo il beach volley sarà olimpico.","luogo":"","fonti":[{"i":"FIVB","t":"FIVB celebrates 75th Anniversary","u":"https://www.fivb.com/fivb-celebrates-75th-anniversary/"}],"italia":false,"nota":""},{"id":"volley-fenomeni","sport":"pallavolo","anno":1990,"data":"","circa":false,"titolo":"La «generazione dei fenomeni»","testo":"Con Julio Velasco in panchina l'Italia vince il Mondiale 1990 a Rio de Janeiro. È il primo di tre titoli mondiali di fila: poi Atene 1994 e Tokyo 1998.","luogo":"Rio de Janeiro","fonti":[{"i":"Volleyball World","t":"Worlds' roll of honour: 1949-2018","u":"https://en.volleyballworld.com/volleyball/competitions/men-world-championship/2022/news/men-s-world-championship-roll-of-honour"},{"i":"olympics.com","t":"De Giorgi, Velasco e Giani: dalla Generazione dei Fenomeni a Parigi 2024","u":"https://www.olympics.com/it/notizie/pallavolo-degiorgi-giani-velasco-olimpiadi-parigi-2024-generazione-fenomeni"}],"italia":true,"nota":""},{"id":"calcio-donne-1991","sport":"calcio","anno":1991,"data":"","circa":false,"titolo":"Il primo Mondiale femminile","testo":"La FIFA organizza in Cina il primo Campionato del mondo femminile.","luogo":"Cina","fonti":[{"i":"FIFA","t":"We are FIFA","u":"https://jobs.fifa.com/we-are-fifa"}],"italia":false,"nota":""},{"id":"beach-atlanta-1996","sport":"beach","anno":1996,"data":"","circa":false,"titolo":"Il beach volley diventa olimpico","testo":"Dopo la prova dimostrativa di Barcellona 1992, il beach volley entra nei Giochi ad Atlanta: oltre 107.000 spettatori in sei giorni. Vincono Karch Kiraly e Kent Steffes (USA) e Jackie Silva e Sandra Pires (Brasile).","luogo":"Atlanta (USA)","fonti":[{"i":"FIVB","t":"Beach volleyball marks 30 years as an Olympic sport","u":"https://www.fivb.com/beach-volleyball-marks-30-years-as-an-olympic-sport/"},{"i":"olympics.com","t":"Beach volleyball rules: All you need to know","u":"https://www.olympics.com/en/news/beach-volleyball-indoor-difference-rules-history-olympics"}],"italia":false,"nota":""},{"id":"beach-mondiali-1997","sport":"beach","anno":1997,"data":"","circa":false,"titolo":"I primi Mondiali di beach volley","testo":"L'anno dopo il debutto olimpico la FIVB organizza i primi Campionati del mondo di beach volley.","luogo":"","fonti":[{"i":"olympics.com","t":"History of volleyball: From origins to the Olympics","u":"https://www.olympics.com/en/news/what-history-volleyball-game-origin-mintonette-ymca-fivb-olympics"}],"italia":false,"nota":"La sede non è stata verificata in questa sessione e non è indicata."},{"id":"basket-euro-1999"   onde: '<path d="M2 9q2.5-3 5 0t5 0 5 0 5 0M2 14q2.5-3 5 0t5 0 5 0 5 0M2 19q2.5-3 5 0t5 0 5 0 5 0" fill="none" stroke="currentColor" stroke-width="1.7"/>'
};
const icona = (k, col) => `<svg viewBox="0 0 24 24" style="color:${col}" aria-hidden="true">${ICONE[k] || ''}</svg>`;

/* ---------- geometria del mondo ---------- */
const SP = DATI.sport, SPI = Object.fromEntries(SP.map((s, i) => [s.id, i]));
const COL = 210, TW = 180, TH = 76, GAP = 8, TOP = 30, K = 26;
const yAnno = a => TOP + (ULTIMO - a) * K;
const Y1896 = yAnno(DA);
const pre = [...new Set(DATI.voci.filter(v => v.anno < DA).map(v => v.anno))].sort((a, b) => b - a);
const BAND0 = Y1896 + 50, PASSO = 96;
const yVoce = a => a >= DA ? yAnno(a) : BAND0 + 30 + pre.indexOf(a) * PASSO;
const H = BAND0 + 30 + pre.length * PASSO + 60, W = SP.length * COL;

const world = $('world'), stage = $('stage');
world.style.width = W + 'px'; world.style.height = H + 'px';
let html = '';
SP.forEach((s, i) => { html += `<div class="colbg${i % 2 ? ' alt' : ''}" style="left:${i * COL}px;width:${COL}px;height:${H}px"></div>`; });
for (let y = Math.ceil(DA / 10) * 10; y <= ULTIMO; y += 10) html += `<div class="decade" style="top:${yAnno(y)}px;width:${W}px"></div>`;
html += `<div class="band" style="top:${BAND0}px;width:${W}px;height:${H - BAND0}px"><span>Prima del ${DA}</span></div>`;
/* disposizione: una colonna per sport; se due tessere si toccano, la più vecchia scende */
const POS = new Map();
SP.forEach((s, i) => {
  const vv = DATI.voci.filter(v => v.sport === s.id).sort((a, b) => yVoce(a.anno) - yVoce(b.anno));
  let ultimo = -1e9;
  const x = i * COL + 22;
  if (vv.length) html += `<div class="guide" style="left:${i * COL + 10}px;top:${yVoce(vv[0].anno)}px;height:${yVoce(vv[vv.length - 1].anno) - yVoce(vv[0].anno) + 1}px;background:${s.colore}"></div>`;
  vv.forEach(v => {
    const y0 = yVoce(v.anno), y = Math.max(y0 - 14, ultimo + GAP);
    ultimo = y + TH;
    POS.set(v.id, {x, y});
    html += `<div class="pin" style="left:${i * COL + 11}px;top:${y0}px;background:${s.colore}"></div>`;
    if (Math.abs(y + 14 - y0) > 2) html += `<div class="link" style="left:${i * COL + 11}px;top:${y0}px;width:11px;background:${s.colore}"></div>`;
    const anno = v.anno < 0 ? Math.abs(v.anno) + ' a.C.' : (v.circa ? 'circa ' : '') + v.anno;
    html += `<div class="tile" data-id="${v.id}" role="button" tabindex="0" style="left:${x}px;top:${y}px;border-left-color:${s.colore}">` +
      `<div class="y">${anno}</div><div class="t">${esc(v.titolo)}</div>${v.italia ? '<span class="ita" title="Italia"></span>' : ''}</div>`;
  });
});
world.innerHTML = html;
$('heads').innerHTML = SP.map(s => `<div class="head" data-sport="${s.id}" style="border-top-color:${s.colore}" title="${esc(s.nome)}">${icona(s.icona, s.colore)}<b>${esc(s.nome)}</b>${DATI.albi[s.id] ? '<span class="albo">albo</span>' : ''}</div>`).join('');
const HEADS = [...document.querySelectorAll('.head')];
const gut = $('gutter');
const LABELS = [];
for (let y = DA; y <= ULTIMO; y++) { if (y % 5 && y !== ULTIMO && y !== DA) continue; const e = document.createElement('span'); e.textContent = y; e.dataset.y = y; if (y % 50 === 0 || y === DA || y === ULTIMO) e.classList.add('b'); gut.appendChild(e); LABELS.push(e); }

/* ---------- vista: spostamento e zoom ---------- */
const V = {s: 1, x: 0, y: 0};
const HEAD = 44;
const area = () => ({w: stage.clientWidth, h: stage.clientHeight});
const minS = () => Math.min((area().w - 58) / W, (area().h - HEAD) / H);
const maxS = () => 2.2;
function clamp() {
  const {w, h} = area(), sw = W * V.s, sh = H * V.s, L = 58, T = HEAD;
  V.x = sw + L < w ? L + (w - L - sw) / 2 : Math.min(L, Math.max(w - sw - 10, V.x));
  V.y = Math.min(T, Math.max(h - sh - 10, V.y));
}
let raf = 0;
function draw() {
  raf = 0; clamp();
  world.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
  world.classList.toggle('far', V.s < 0.62);
  const cw = COL * V.s;
  HEADS.forEach((e, i) => { e.style.left = (V.x - 58 + i * cw) + 'px'; e.style.width = cw + 'px'; e.querySelector('b').style.display = cw < 74 ? 'none' : ''; const a = e.querySelector('.albo'); if (a) a.style.display = cw < 150 ? 'none' : ''; });
  const passo = V.s * K * 5 < 16 ? (V.s * K * 10 < 16 ? 50 : 10) : 5;
  LABELS.forEach(e => { const y = +e.dataset.y, on = y % passo === 0 || y === ULTIMO; e.style.display = on ? '' : 'none'; if (on) e.style.top = (V.y + yAnno(y) * V.s) + 'px'; });
}
const redraw = () => { if (!raf) raf = requestAnimationFrame(draw); };
function zoomAt(ns, px, py) { ns = Math.max(minS(), Math.min(maxS(), ns)); const k = ns / V.s; V.x = px - (px - V.x) * k; V.y = py - (py - V.y) * k; V.s = ns; redraw(); }
function tutto() { V.s = minS(); V.x = 0; V.y = HEAD; redraw(); }
function inizio() {
  const {w} = area();
  if (w >= 900) { V.s = Math.max(minS(), Math.min(0.9, Math.max(0.78, (w - 58) / W))); V.x = 58; V.y = HEAD; }
  else { V.s = 0.82; V.x = 58 - SPI.basket * COL * V.s + 4; V.y = HEAD; }
  redraw();
}

/* trascinamento, due dita, rotella */
const ptr = new Map(); let moved = false, start = null, pinch = null;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); ptr.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptr.size === 1) { moved = false; start = {x: e.clientX, y: e.clientY, vx: V.x, vy: V.y, t: e.target}; }
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s}; moved = true; }
});
stage.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; ptr.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const r = stage.getBoundingClientRect();
  if (ptr.size === 2 && pinch) { const [a, b] = [...ptr.values()]; zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return; }
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (!moved && Math.hypot(dx, dy) > 6) { moved = true; stage.classList.add('drag'); }
  if (moved) { V.x = start.vx + dx; V.y = start.vy + dy; redraw(); }
});
const fine = e => {
  ptr.delete(e.pointerId); stage.classList.remove('drag');
  if (ptr.size < 2) pinch = null;
  if (ptr.size === 0) { if (!moved && start) { const t = start.t.closest && start.t.closest('.tile'); if (t) apriVoce(t.dataset.id); } start = null; }
};
stage.addEventListener('pointerup', fine); stage.addEventListener('pointercancel', fine);
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  if (e.ctrlKey) zoomAt(V.s * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { V.x -= e.shiftKey ? e.deltaY : e.deltaX; V.y -= e.shiftKey ? 0 : e.deltaY; redraw(); }
}, {passive: false});
stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); zoomAt(V.s * 1.6, e.clientX - r.left, e.clientY - r.top); });
stage.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('tile')) apriVoce(e.target.dataset.id); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#panel')) return;
  const {w, h} = area(), m = {ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80]}[e.key];
  if (m) { V.x += m[0]; V.y += m[1]; redraw(); e.preventDefault(); }
  else if (e.key === '+' || e.key === '=') zoomAt(V.s * 1.25, w / 2, h / 2);
  else if (e.key === '-') zoomAt(V.s / 1.25, w / 2, h / 2);
  else if (e.key === '0') tutto();
  else if (e.key === 'Escape') chiudi();
});
$('bPiu').onclick = () => { const {w, h} = area(); zoomAt(V.s * 1.3, w / 2, h / 2); };
$('bMeno').onclick = () => { const {w, h} = area(); zoomAt(V.s / 1.3, w / 2, h / 2); };
$('bTutto').onclick = tutto;
$('bAlbi').onclick = apriAlbi;
HEADS.forEach(e => e.addEventListener('click', () => apriSport(e.dataset.sport)));
addEventListener('resize', redraw);

/* ---------- scheda ---------- */
const panel = $('panel');
const chip = s => `<button class="chip" type="button" data-sport="${s.id}">${icona(s.icona, s.colore)}${esc(s.nome)}</button>`;
function mostra(htmlBody, hash) {
  panel.innerHTML = `<div class="pin-close"><span></span><button type="button" aria-label="Chiudi" id="bChiudi">×</button></div><div class="body">${htmlBody}<div class="foot">Pilu Sports Almanac · dati aggiornati al ${esc(DATI.aggiornato)}</div></div>`;
  panel.classList.add('open'); panel.scrollTop = 0;
  $('bChiudi').onclick = chiudi;
  panel.querySelectorAll('[data-sport]').forEach(b => b.onclick = () => apriSport(b.dataset.sport));
  panel.querySelectorAll('[data-voce]').forEach(b => b.onclick = () => apriVoce(b.dataset.voce, true));
  if (hash) history.replaceState(null, '', '#' + hash);
}
function chiudi() { panel.classList.remove('open'); document.querySelectorAll('.tile.sel').forEach(t => t.classList.remove('sel')); history.replaceState(null, '', location.pathname); }
const fonti = ff => '<ul class="fonti">' + ff.map(f => `<li><a href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.t)}</a> <span class="ist">· ${esc(f.i)}</span></li>`).join('') + '</ul>';
function apriVoce(id, vai) {
  const v = DATI.voci.find(x => x.id === id); if (!v) return;
  const s = SP[SPI[v.sport]];
  document.querySelectorAll('.tile.sel').forEach(t => t.classList.remove('sel'));
  const el = world.querySelector(`.tile[data-id="${id}"]`); el && el.classList.add('sel');
  if (vai) { const p = POS.get(id), {w, h} = area(); V.x = (w > 700 ? (w - 440) / 2 : w / 2) - (p.x + TW / 2) * V.s; V.y = (w > 700 ? h / 2 : h * 0.18) - (p.y + TH / 2) * V.s; redraw(); }
  const quando = v.data || (v.anno < 0 ? Math.abs(v.anno) + ' a.C.' : (v.circa ? 'circa ' : '') + v.anno);
  mostra(`${chip(s)}<h2>${esc(v.titolo)}${v.italia ? '<span class="flag">ITALIA</span>' : ''}</h2>
    <div class="meta">${esc(quando)}${v.luogo ? ` <span class="luogo">· ${esc(v.luogo)}</span>` : ''}</div>
    <p>${esc(v.testo)}</p>
    ${v.nota ? `<div class="nota">${esc(v.nota)}</div>` : ''}
    <h3>Fonti</h3>${fonti(v.fonti)}
    ${DATI.albi[v.sport] ? `<p><button class="chip" type="button" data-sport="${s.id}">Albo d'oro di ${esc(s.nome.toLowerCase())} →</button></p>` : ''}`, 'voce=' + id);
}
function tabella(a, k) {
  const t = a.tornei[k];
  return `<table class="albo"><colgroup><col class="c-a"><col><col class="c-r"><col><col></colgroup><thead><tr><th>Anno</th><th>Oro</th><th>Finale</th><th>Argento</th><th>Bronzo</th></tr></thead><tbody>` +
    t.righe.slice().reverse().map(r => `<tr class="${[r.oro, r.argento, r.bronzo].some(x => x.includes('Italia')) ? 'ita' : ''}"><td class="a">${r.anno}<span class="sede">${esc(r.sede)}</span></td><td>${esc(r.oro)}</td><td class="r">${esc(r.ris)}</td><td>${esc(r.argento)}</td><td>${esc(r.bronzo)}</td></tr>`).join('') + '</tbody></table>';
}
function apriSport(id, k = 0) {
  const s = SP[SPI[id]], a = DATI.albi[id];
  const vv = DATI.voci.filter(v => v.sport === id).sort((x, y) => y.anno - x.anno);
  let corpo = `${chip(s)}<h2>${esc(s.nome)}</h2>`;
  if (a) corpo += `<h3>${esc(a.titolo)}</h3><div class="tabs">${a.tornei.map((t, i) => `<button type="button" data-k="${i}" class="${i === k ? 'on' : ''}">${esc(t.nome)}</button>`).join('')}</div>${tabella(a, k)}
    <div class="nota">In verde le edizioni con l'Italia sul podio. ${esc(DATI.nota_albi)}</div><h3>Fonti dell'albo d'oro</h3>${fonti(a.fonti)}`;
  else corpo += `<div class="nota">Albo d'oro non ancora inserito per questo sport.</div>`;
  corpo += `<h3>Le tessere (${vv.length})</h3><ul class="lista">${vv.map(v => `<li data-voce="${v.id}"><span class="ly">${v.anno < 0 ? Math.abs(v.anno) + ' a.C.' : v.anno}</span><span>${esc(v.titolo)}</span></li>`).join('')}</ul>`;
  mostra(corpo, 'sport=' + id);
  panel.querySelectorAll('.tabs button').forEach(b => b.onclick = () => apriSport(id, +b.dataset.k));
}
function apriAlbi() {
  mostra(`<h2>Albi d'oro</h2><p>Medaglie olimpiche, edizione per edizione.</p><div class="albi-lista">` +
    Object.entries(DATI.albi).map(([id, a]) => { const s = SP[SPI[id]]; return `<button type="button" data-sport="${id}">${icona(s.icona, s.colore)}<span><b>${esc(s.nome)}</b><br><small>${esc(a.titolo)}</small></span></button>`; }).join('') + '</div>', 'albi');
}

/* ---------- avvio ---------- */
inizio();
function daIndirizzo() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('voce')) apriVoce(h.get('voce'), true); else if (h.get('sport')) apriSport(h.get('sport')); else if (location.hash === '#albi') apriAlbi();
}
daIndirizzo();
addEventListener('hashchange', daIndirizzo);
setTimeout(() => $('hint').classList.add('off'), 6000);
</script>
</body>
</html>
