<!DOCTYPE html>
<html lang="it" data-stile="notte">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<title>Pilu Sports Almanac</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* stile salvato su questo dispositivo: va applicato prima di disegnare la pagina */
try { const s = localStorage.getItem('almanacco-stile'); if (s === 'notte' || s === 'pastello') document.documentElement.dataset.stile = s; } catch (e) {}
</script>
<style>
:root{--gut:58px;--top:54px;--head:46px}
html[data-stile=notte]{--bg:#12141b;--bgpat:radial-gradient(ellipse at 50% -10%,#232a3a,transparent 60%);--bar:#0c0e13;--bartx:#eef1f6;--card:#1b1f2a;--tx:#eef1f6;--mute:#8b93a6;--line:#262c3a;--acc:#7cf0c8;--acct:#7cf0c8;--acctx:#0c0e13;--btn:#1b1f2a;--btnh:#262c3a;--btnb:rgba(255,255,255,.16);--headbg:#161a23;--sheet:#161a23;--col:#1c2130;--hover:#1f2431;--soft:rgba(255,255,255,.06);--hl:rgba(124,240,200,.18);--mark:rgba(124,240,200,.28);--ombra:0 0 0 1px rgba(255,255,255,.04),0 8px 18px rgba(0,0,0,.4);--tb:3px solid var(--c);--tbt:3px solid var(--c);--tr:10px;--gutbg:#12141b}
html[data-stile=pastello]{--bg:#eef2fb;--bgpat:linear-gradient(160deg,#f6eefc,#eaf6f3);--bar:rgba(255,255,255,.86);--bartx:#2b2d42;--card:#fff;--tx:#2b2d42;--mute:#666c88;--line:#e2e4f0;--acc:#8b6cf0;--acct:#6a4fd6;--acctx:#fff;--btn:#fff;--btnh:#f3f0fe;--btnb:#e2e4f0;--headbg:rgba(255,255,255,.82);--sheet:#fbfbff;--col:transparent;--hover:#f3f0fe;--soft:rgba(43,45,66,.07);--hl:rgba(139,108,240,.16);--mark:rgba(139,108,240,.25);--ombra:0 4px 14px rgba(80,70,140,.12);--tb:0;--tbt:5px solid var(--c);--tr:14px;--gutbg:#f2f0fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--acct)}
.bar{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;background:var(--bar);color:var(--bartx);z-index:30;touch-action:none}
html[data-stile=notte] .bar{border-bottom:3px solid var(--acc)}
html[data-stile=pastello] .bar{border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar .logo{width:28px;height:28px;flex:none}
.bar .back{color:var(--mute);text-decoration:none;font-size:13px;white-space:nowrap}
.bar h1{margin:0;font-size:19px;font-weight:850;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bar h1 .anni{color:var(--acct);margin-left:.3em}
.bar .btn{background:var(--btn);border:1px solid var(--btnb);border-radius:8px;height:34px;min-width:34px;padding:0 11px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--bartx)}
html[data-stile=notte] .bar .btn{background:transparent}
html[data-stile=pastello] .bar .btn{border-radius:999px}
.bar .btn:hover{background:var(--btnh)}
.stili{position:fixed;top:calc(var(--top) + 6px);right:10px;z-index:45;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--ombra);padding:8px;display:none;min-width:220px}
.stili.open{display:block}
.stili b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:2px 6px 6px}
.stili button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:8px;cursor:pointer}
.stili button:hover{background:var(--hover)}
.stili button[aria-pressed=true]{border-color:var(--acc)}
.stili i{display:flex;flex:none;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.stili i span{width:12px;height:24px}
.stili small{display:block;color:var(--mute);font-size:12px}
#stage{position:fixed;left:0;right:0;top:var(--top);bottom:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--bgpat),var(--bg)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.colbg{position:absolute;top:0;border-left:1px dashed var(--col)}
.guide{position:absolute;width:3px;border-radius:2px;opacity:.4}
.decade{position:absolute;left:0;height:1px;background:var(--soft)}
.band{position:absolute;left:0;background:repeating-linear-gradient(135deg,var(--soft) 0 10px,transparent 10px 20px);border-top:1px dashed var(--acc)}
.band span{position:absolute;left:10px;top:8px;font-size:22px;font-weight:800;color:var(--acct);opacity:.7;letter-spacing:.04em}
.pin{position:absolute;width:9px;height:9px;border-radius:50%;margin:-4.5px 0 0 -4px;border:2px solid var(--bg)}
.link{position:absolute;height:1px;opacity:.5}
.tile{position:absolute;width:180px;height:78px;padding:8px 10px;border-radius:var(--tr);background:var(--card);border:var(--tb);border-top:var(--tbt);cursor:pointer;box-shadow:var(--ombra)}
.tile:hover{filter:brightness(1.06)}
.tile.sel{outline:3px solid var(--acc);outline-offset:2px}
.tile .y{position:absolute;right:-3px;top:-3px;background:var(--c);color:var(--ct);font-size:12px;font-weight:800;padding:2px 8px;border-radius:0 var(--tr) 0 9px;font-variant-numeric:tabular-nums}
html[data-stile=pastello] .tile .y{right:0;top:-5px}
.tile .t{font-size:13.5px;font-weight:700;line-height:1.22;margin-top:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ita{display:inline-block;width:18px;height:6px;border-radius:2px;background:linear-gradient(90deg,#1f9c4b 0 33%,#fff 33% 66%,#d23a3a 66%);box-shadow:0 0 0 1px rgba(0,0,0,.18);vertical-align:2px}
.tile .ita{position:absolute;left:10px;top:9px}
#world.far .tile .t,#world.far .tile .ita{display:none}
#world.far .tile .y{left:0;right:0;top:0;bottom:0;border-radius:calc(var(--tr) - 3px);display:flex;align-items:center;justify-content:center;font-size:24px;padding:0}
.mk{position:absolute;width:16px;height:16px;margin:-8px 0 0 -7px;border-radius:50%;z-index:2;font:800 9px/16px system-ui,sans-serif;text-align:center;color:#2a2418;box-shadow:0 0 0 2px var(--bg)}
.mk.oro{background:#f2c94c}.mk.argento{background:#c9d1d9}.mk.bronzo{background:#d08a4e}
.mk.all{background:var(--bg)!important;border:2px dashed #f2c94c;line-height:12px;color:var(--tx)}
.mk.all.argento{border-color:#c9d1d9}.mk.all.bronzo{border-color:#d08a4e}
#heads{position:fixed;left:var(--gut);right:0;top:var(--top);height:var(--head);z-index:20;overflow:hidden;pointer-events:none;background:var(--headbg);border-bottom:1px solid var(--line)}
.head{position:absolute;top:0;height:var(--head);display:flex;align-items:center;gap:6px;padding:0 10px;pointer-events:auto;cursor:pointer;white-space:nowrap;overflow:hidden}
.head::before{content:"";position:absolute;left:8px;right:8px;top:0;height:5px;background:var(--c);border-radius:0 0 4px 4px}
.head:hover{background:var(--hover)}
.head svg{flex:none;width:20px;height:20px}
.head b{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.head .albo{font-size:10px;color:var(--acct);border:1px solid var(--acc);border-radius:4px;padding:0 4px}
#gutter{position:fixed;left:0;top:var(--top);bottom:0;width:var(--gut);z-index:19;overflow:hidden;pointer-events:none;background:linear-gradient(90deg,var(--gutbg) 70%,transparent)}
#gutter span{position:absolute;left:8px;font-size:12px;font-weight:600;color:var(--mute);transform:translateY(-50%);font-variant-numeric:tabular-nums}
#gutter span.b{color:var(--tx);font-weight:800}
#gutter .corner{position:absolute;z-index:1;left:0;top:0;width:var(--gut);height:var(--head);background:var(--headbg);border-bottom:1px solid var(--line)}
#vista{position:fixed;left:calc(var(--gut) + 8px);top:calc(var(--top) + var(--head) + 8px);z-index:22;display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--acc);border-radius:999px;padding:4px 4px 4px 12px;box-shadow:var(--ombra);font-size:13px;max-width:calc(100vw - var(--gut) - 16px)}
#vista.on{display:flex}
#vista span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vista button{flex:none;border:0;background:var(--acc);color:var(--acctx);border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:12.5px}
/* scheda */
#panel{position:fixed;z-index:40;background:var(--sheet);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.25);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;right:0;top:var(--top);bottom:0;width:min(460px,100vw);transform:translateX(105%);transition:transform .22s ease-out}
#panel.open{transform:none}
.grip{display:none}
@media (max-width:700px){
 #panel{left:0;right:0;top:auto;width:auto;height:74vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
 #panel.open{transform:none}
 #panel.drag{transition:none}
 .grip{display:block;position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--mute);opacity:.6}
 .bar h1{font-size:15px}
 .bar{gap:6px;padding:0 8px}
 .bar .btn{padding:0 9px;font-size:13px}
 .lungo{display:none}
 .bar .back{display:none}
 .bar .btn.z{display:none}
 .bar .logo{width:24px;height:24px}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
.pin-close{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 12px 6px 16px;background:var(--sheet);z-index:3;touch-action:none}
.pin-close button{background:var(--btn);border:1px solid var(--btnb);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 6px;border-radius:999px;background:var(--btn);border:1px solid var(--btnb);cursor:pointer;margin:0 4px 4px 0}
.chip svg{width:16px;height:16px}
.body{padding:2px 16px 24px}
.body h2{margin:6px 0 2px;font-size:21px;line-height:1.2}
.body h2 .ita{margin-left:8px;vertical-align:4px}
.meta{color:var(--acct);font-weight:650;font-size:14px}
.meta .luogo{color:var(--mute);font-weight:400}
.body p{margin:10px 0}
.body h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:18px 0 6px}
.body h4{font-size:14px;margin:12px 0 4px}
.fonti{margin:0;padding-left:18px;font-size:13.5px}
.fonti li{margin:3px 0}
.fonti .ist{color:var(--mute)}
.nota{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:10px 0}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--btnb);background:var(--btn);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--acc);color:var(--acctx);border-color:var(--acc);font-weight:700}
.tabs.sub{margin-top:-2px}
.tabs.sub button{font-size:12px;padding:3px 10px}
.tabs.disc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.tabs.disc::-webkit-scrollbar{display:none}
.tabs.disc button{flex:none}
table.albo{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.albo col.c-a{width:64px}table.albo col.c-r{width:58px}table.albo col.c-s{width:70px}
table.albo td{overflow-wrap:anywhere}
table.albo th{text-align:left;color:var(--mute);font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px;border-bottom:1px solid var(--line);position:sticky;top:54px;background:var(--sheet);z-index:2}
table.albo td{padding:5px 4px;border-bottom:1px solid var(--soft);vertical-align:top}
table.albo td.a{font-weight:800;color:var(--acct);white-space:nowrap}
table.albo td.r{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
table.albo td .sede{display:block;white-space:normal;color:var(--mute);font-size:11.5px;font-weight:400}
table.albo td .ita{margin-right:5px}
table.albo td .nr{display:block;color:var(--mute);font-size:11px;margin-top:2px}
table.albo tr.hl td{background:var(--hl)}
.tnota{font-size:12.5px;color:var(--mute);margin:6px 0 8px}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.lista li:hover{color:var(--acct)}
.lista .ly{width:58px;flex:none;color:var(--acct);font-weight:800;font-variant-numeric:tabular-nums}
.albi-lista button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;box-shadow:var(--ombra)}
.albi-lista svg{width:26px;height:26px;flex:none}
.foot{font-size:12px;color:var(--mute);margin-top:22px}
/* palmarès */
.conti{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.conti span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 5px;font-size:13px;font-weight:700}
.med{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;vertical-align:-2px}
.med.oro,.med.titolo,.med.vittoria{background:#f2c94c}.med.argento{background:#c9d1d9}.med.bronzo{background:#d08a4e}
.palm{list-style:none;margin:0;padding:0}
.palm li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--soft);font-size:13.5px}
.palm .ly{width:62px;flex:none;font-weight:800;color:var(--acct);font-variant-numeric:tabular-nums}
.palm .pt{flex:1;min-width:0}
.palm .ps{color:var(--mute);font-size:12px}
.palm button{flex:none;border:1px solid var(--btnb);background:var(--btn);border-radius:999px;padding:1px 9px;font-size:12px;cursor:pointer;color:var(--acct)}
.dubbio{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f2c94c;box-shadow:0 0 0 2px rgba(242,201,76,.35);margin-left:6px;vertical-align:0}
.azione{border:1px solid var(--btnb);background:var(--btn);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;margin:4px 6px 4px 0}
.hint{position:fixed;left:50%;bottom:16px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);z-index:25;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--mute);pointer-events:none;transition:opacity .4s;box-shadow:var(--ombra)}
.hint.off{opacity:0}
/* tirare giù la barra per ricaricare */
#tira{position:fixed;left:50%;top:var(--top);z-index:29;transform:translate(-50%,-120%);background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;box-shadow:var(--ombra);pointer-events:none;white-space:nowrap}
#tira.pronto{border-color:var(--acc);color:var(--acct);font-weight:700}
/* nuova versione */
#nuova{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--acc);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--ombra);font-size:13.5px;white-space:nowrap}
#nuova.on{display:flex}
#nuova button{border:0;background:var(--acc);color:var(--acctx);border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer}
/* pagina di ricerca */
#cerca{position:fixed;left:0;right:0;top:var(--top);bottom:0;z-index:35;background:var(--bgpat),var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none}
#cerca.open{display:block}
#cerca .wrap{max-width:1000px;margin:0 auto;padding:14px 14px 40px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
#cerca .campo{grid-column:1/-1;display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:4}
#cerca input[type=search]{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--tx);font:inherit;font-size:16px;padding:0 14px}
#cerca input:focus{outline:none;box-shadow:0 0 0 3px var(--mark)}
#cerca .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--btnb);background:var(--btn);cursor:pointer;font-size:20px}
#fBtn{display:none;grid-column:1/-1;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--ombra);font-size:14px;cursor:pointer;text-align:left}
#fBtn b{color:var(--acct);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#filtri{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--ombra);position:sticky;top:64px}
#filtri h4{margin:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#filtri h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:12.5px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--btnb);background:var(--btn);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.chips button svg{width:14px;height:14px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acctx);font-weight:700}
.chips button.on svg{color:var(--acctx)!important}
#filtri select,#filtri input{font:inherit;font-size:13.5px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
#filtri select{width:100%}
.anni-f{display:flex;gap:6px;align-items:center}
.anni-f input{width:84px}
#azzera{margin-top:12px;border:0;background:none;color:var(--acct);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
@media (max-width:760px){#cerca .wrap{grid-template-columns:minmax(0,1fr);padding:10px 12px 40px;gap:10px}#fBtn{display:flex}#filtri{display:none;position:static}#filtri.open{display:block}}
.conta{font-size:13px;color:var(--mute);margin:2px 0 4px}
.ris h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:16px 0 6px}
.ris h3:first-of-type{margin-top:6px}
.ris ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ris li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;cursor:pointer;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);box-shadow:var(--ombra)}
.ris li:hover,.ris li:focus{background:var(--hover);outline:none}
.ris .ly{width:58px;flex:none;color:var(--acct);font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px}
.ris .rt{flex:1;min-width:0}
.ris .rt b{font-weight:650}
.ris .rs{display:block;font-size:12.5px;color:var(--mute)}
.ris .ita{margin-right:4px}
.ris mark{background:var(--mark);color:inherit;border-radius:2px}
.ris .piu{margin:12px 0;border:1px solid var(--btnb);background:var(--btn);border-radius:8px;padding:6px 12px;cursor:pointer}
.ris .med{margin-right:3px}
.ris .su{font-weight:800}
.vuoto{color:var(--mute);margin:18px 0}
.suggerimenti{color:var(--mute);font-size:13.5px}
.suggerimenti button{border:0;background:none;color:var(--acct);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
</style>
</head>
<body>

<script>
const DATI = {"sport":[{"id":"olimpiadi","nome":"Olimpiadi e mondo","colore":"#c8a85a","icona":"globo"},{"id":"basket","nome":"Basket","colore":"#e2772f","icona":"basket"},{"id":"pallavolo","nome":"Pallavolo","colore":"#3f8fdc","icona":"volley"},{"id":"beach","nome":"Beach volley","colore":"#e8c24a","icona":"beach"},{"id":"atletica","nome":"Atletica","colore":"#d4574f","icona":"pista"},{"id":"calcio","nome":"Calcio","colore":"#3fae62","icona":"calcio"},{"id":"ciclismo","nome":"Ciclismo","colore":"#e3699f","icona":"bici"},{"id":"tennis","nome":"Tennis","colore":"#b7d33f","icona":"tennis"},{"id":"motori","nome":"Motori","colore":"#9aa3ad","icona":"scacchi"},{"id":"sci","nome":"Sci","colore":"#8fd6f6","icona":"sci"},{"id":"nuoto","nome":"Nuoto","colore":"#2fb7b3","icona":"onde"},{"id":"ginnastica","nome":"Ginnastica","colore":"#a98ce8","icona":"anelli"}],"voci":[{"id":"olimpia","sport":"olimpiadi","anno":-776,"data":"","circa":true,"titolo":"I Giochi di Olimpia","testo":"Nel santuario di Zeus a Olimpia, nel Peloponneso, si tengono i Giochi più famosi della Grecia antica. La data del 776 a.C. è quella che citano di solito le fonti scritte; i Giochi si svolgono ogni quattro anni fino al 393 d.C.","luogo":"Olimpia (Grecia)","fonti":[{"i":"olympics.com","t":"What is the origin of the Olympic Games?","u":"https://www.olympics.com/ioc/faq/history-and-origin-of-the-games/what-is-the-origin-of-the-olympic-games"},{"i":"olympics.com","t":"Athens 1896 - 125 years of shared Olympic values","u":"https://www.olympics.com/ioc/news/athens-1896-125-years-of-shared-olympic-values"}],"italia":false,"nota":"Il CIO scrive che la data esatta d'inizio non si conosce: il 776 a.C. è la data tradizionale."},{"id":"calcio-fa","sport":"calcio","anno":1863,"data":"26 ottobre 1863","circa":false,"titolo":"Le prime regole del calcio","testo":"Il 26 ottobre 1863, alla Freemasons' Tavern di Londra, i rappresentanti di una dozzina di club fondano la Football Association e scrivono le prime regole comuni del gioco.","luogo":"Londra","fonti":[{"i":"The FA","t":"The History of The FA","u":"https://www.thefa.com/about-football-association/who-we-are/history"},{"i":"Britannica","t":"Football Association (FA)","u":"https://www.britannica.com/topic/Football-Association"}],"italia":false,"nota":""},{"id":"tennis-wimbledon","sport":"tennis","anno":1877,"data":"","circa":false,"titolo":"Il primo Wimbledon","testo":"Nel luglio 1877 l'All England Croquet and Lawn Tennis Club organizza il primo torneo di tennis su prato: 22 iscritti, solo il singolare maschile. Vince Spencer Gore.","luogo":"Londra, Wimbledon","fonti":[{"i":"Britannica","t":"Tennis","u":"https://www.britannica.com/sports/tennis"},{"i":"Wimbledon","t":"The Championships 1877 Gentlemen's Singles","u":"https://assets.wimbledon.com/archive/draws/pdfs/draws/1877_MS_A4.pdf"}],"italia":false,"nota":""},{"id":"basket-naismith","sport":"basket","anno":1891,"data":"21 dicembre 1891","circa":false,"titolo":"Naismith inventa il basket","testo":"James Naismith, insegnante di educazione fisica alla scuola della YMCA di Springfield, nel Massachusetts, inventa un gioco da palestra per l'inverno. La prima partita si gioca il 21 dicembre 1891, con due cesti da pesche come canestri.","luogo":"Springfield (Massachusetts, USA)","fonti":[{"i":"Britannica","t":"Basketball","u":"https://www.britannica.com/sports/basketball"},{"i":"Naismith Basketball Hall of Fame","t":"First Team","u":"https://www.hoophall.com/hall-of-famers/first-team"}],"italia":false,"nota":""},{"id":"cio-1894","sport":"olimpiadi","anno":1894,"data":"23 giugno 1894","circa":false,"titolo":"Nasce il Comitato olimpico internazionale","testo":"Il 23 giugno 1894, alla Sorbona di Parigi, un congresso organizzato da Pierre de Coubertin approva all'unanimità il ritorno dei Giochi olimpici. È la nascita del CIO.","luogo":"Parigi, Sorbona","fonti":[{"i":"olympics.com","t":"International Olympic Committee","u":"https://www.olympics.com/ioc/overview"},{"i":"olympics.com","t":"factsheet - Olympic Day (23 June)","u":"https://stillmed.olympics.com/media/Documents/Beyond-the-Games/Factsheets/Olympic-Day.pdf"}],"italia":false,"nota":""},{"id":"volley-morgan","sport":"pallavolo","anno":1895,"data":"","circa":false,"titolo":"Morgan inventa la pallavolo","testo":"William G. Morgan, direttore sportivo della YMCA di Holyoke, nel Massachusetts, inventa un gioco meno faticoso del basket e lo chiama «mintonette». Presto diventerà volleyball.","luogo":"Holyoke (Massachusetts, USA)","fonti":[{"i":"FIVB","t":"History","u":"https://www.fivb.com/volleyball/the-game/history/"},{"i":"Britannica","t":"Who invented volleyball?","u":"https://www.britannica.com/question/Who-invented-volleyball"}],"italia":false,"nota":""},{"id":"atene-1896","sport":"olimpiadi","anno":1896,"data":"6–15 aprile 1896","circa":false,"titolo":"Atene 1896, la prima Olimpiade moderna","testo":"Dal 6 al 15 aprile 1896 Atene ospita i primi Giochi dell'era moderna, nello Stadio Panatenaico: oltre 300 atleti, tutti uomini, in 43 gare di 9 sport.","luogo":"Atene, Stadio Panatenaico","fonti":[{"i":"olympics.com","t":"Athens 1896","u":"https://www.olympics.com/en/sport-events/athens-1896"},{"i":"olympics.com","t":"The Opening Ceremony","u":"https://www.olympics.com/en/news/the-opening-ceremony"}],"italia":false,"nota":""},{"id":"parigi-1900-donne","sport":"olimpiadi","anno":1900,"data":"","circa":false,"titolo":"Parigi 1900: le prime donne ai Giochi","testo":"Ai Giochi di Parigi, legati all'Esposizione universale, gareggiano per la prima volta le donne: 22 su 997 atleti. La tennista britannica Charlotte Cooper è la prima campionessa olimpica in una gara individuale.","luogo":"Parigi","fonti":[{"i":"olympics.com","t":"The first women Olympians","u":"https://www.olympics.com/en/news/the-first-women-olympians"},{"i":"olympics.com","t":"Paris 1900 Summer Olympics","u":"https://www.olympics.com/en/olympic-games/paris-1900"}],"italia":false,"nota":""},{"id":"tennis-davis","sport":"tennis","anno":1900,"data":"","circa":false,"titolo":"Nasce la Coppa Davis","testo":"Nel 1900 Stati Uniti e Gran Bretagna si sfidano per un trofeo comprato da Dwight Davis: nasce la Coppa Davis, oggi la più grande competizione annuale a squadre nazionali.","luogo":"Boston (USA)","fonti":[{"i":"Davis Cup","t":"History","u":"https://www.daviscup.com/en/about/history"},{"i":"Britannica","t":"Davis Cup","u":"https://www.britannica.com/sports/Davis-Cup"}],"italia":false,"nota":""},{"id":"tour-1903","sport":"ciclismo","anno":1903,"data":"","circa":false,"titolo":"Il primo Tour de France","testo":"Il giornalista Henri Desgrange lancia il Tour de France per far vendere il suo giornale, L'Auto. Partono in 60, arrivano in 21: vince il francese Maurice Garin.","luogo":"Francia","fonti":[{"i":"Britannica","t":"When was the Tour de France first held?","u":"https://www.britannica.com/sports/When-was-the-Tour-de-France-first-held"},{"i":"Britannica","t":"Tour de France winners","u":"https://www.britannica.com/sports/Tour-de-France-winners-2227411"}],"italia":false,"nota":""},{"id":"calcio-fifa","sport":"calcio","anno":1904,"data":"21 maggio 1904","circa":false,"titolo":"Nasce la FIFA","testo":"Il 21 maggio 1904 a Parigi i rappresentanti di sette federazioni europee fondano la Federazione internazionale del calcio.","luogo":"Parigi","fonti":[{"i":"FIFA","t":"FIFA celebrates 119th birthday","u":"https://inside.fifa.com/organisation/news/fifa-celebrates-119th-birthday"},{"i":"FIFA","t":"Happy birthday FIFA!","u":"https://www.fifa.com/who-we-are/news/happy-birthday-fifa-772772"}],"italia":false,"nota":""},{"id":"nuoto-fina","sport":"nuoto","anno":1908,"data":"19 luglio 1908","circa":false,"titolo":"Nasce la FINA","testo":"Il 19 luglio 1908, durante le Olimpiadi di Londra, otto federazioni fondano la Federazione internazionale del nuoto (oggi World Aquatics).","luogo":"Londra","fonti":[{"i":"World Aquatics","t":"Overview and history","u":"https://www.worldaquatics.com/content/overview-and-history"}],"italia":false,"nota":""},{"id":"ciclismo-giro-1909","sport":"ciclismo","anno":1909,"data":"13 maggio 1909","circa":false,"titolo":"Il primo Giro d'Italia","testo":"Il 13 maggio 1909 parte da Milano il primo Giro d'Italia, organizzato dalla Gazzetta dello Sport: 8 tappe e 2.448 km. Vince Luigi Ganna.","luogo":"Milano","fonti":[{"i":"Giro d'Italia","t":"Giro d'Italia: tutte le edizioni storiche 1909-1922","u":"https://archivio.giroditalia.it/it/edizioni/1909-1922/"},{"i":"Giro d'Italia","t":"Ricordi da… Torino, 1909: il primo Giro","u":"https://www.giroditalia.it/news/ricordi-da-torino-1909-il-primo-giro-e-il-cortese-inganno/"}],"italia":true,"nota":""},{"id":"atletica-iaaf","sport":"atletica","anno":1912,"data":"17 luglio 1912","circa":false,"titolo":"Nasce la federazione mondiale","testo":"Il 17 luglio 1912, a Stoccolma, 17 federazioni fondano la IAAF (oggi World Athletics) per avere regole comuni e un elenco ufficiale dei record del mondo.","luogo":"Stoccolma","fonti":[{"i":"World Athletics","t":"Early origins to 1930s","u":"https://worldathletics.org/heritage/history/early-origins-to-1930s"}],"italia":false,"nota":""},{"id":"beach-santa-monica","sport":"beach","anno":1920,"data":"","circa":true,"titolo":"Due contro due a Santa Monica","testo":"Sulle spiagge della California, e soprattutto a Santa Monica, negli anni Venti nasce il gioco a due per squadra. Il primo torneo si gioca alla fine degli anni Quaranta.","luogo":"Santa Monica (California, USA)","fonti":[{"i":"olympics.com","t":"Beach Volleyball","u":"https://www.olympics.com/en/sports/beach-volleyball/"},{"i":"Britannica","t":"Beach volleyball","u":"https://www.britannica.com/sports/beach-volleyball"}],"italia":false,"nota":"Le fonti non concordano: olympics.com indica il 1920 per il gioco a due e il 1947 per il primo torneo; Britannica indica il 1930 e il 1948 (Will Rogers State Beach)."},{"id":"motori-le-mans","sport":"motori","anno":1923,"data":"26–27 maggio 1923","circa":false,"titolo":"La prima 24 Ore di Le Mans","testo":"Il 26 e 27 maggio 1923 33 auto partono per la prima corsa di 24 ore sul circuito di Le Mans. Vincono André Lagache e René Léonard su Chenard & Walcker.","luogo":"Le Mans (Francia)","fonti":[{"i":"24h Le Mans","t":"A century of racing: the 24 Hours of Le Mans is 100 years old!","u":"https://www.24h-lemans.com/en/news/a-century-of-racing-the-24-hours-of-le-mans-is-100-years-old-57463"},{"i":"24h Le Mans","t":"First winner of the 24 Hours of Le Mans","u":"https://www.24h-lemans.com/en/news/first-winner-of-the-24-hours-of-le-mans-who-was-rene-leonard-andre-lagaches-teammate-50683"}],"italia":false,"nota":""},{"id":"chamonix-1924","sport":"olimpiadi","anno":1924,"data":"25 gennaio – 5 febbraio 1924","circa":false,"titolo":"Chamonix 1924, i primi Giochi invernali","testo":"Dal 25 gennaio al 5 febbraio 1924 Chamonix ospita una «Settimana internazionale degli sport invernali» con 258 atleti di 16 paesi. Nel 1926 il CIO la riconosce come prima edizione dei Giochi olimpici invernali.","luogo":"Chamonix (Francia)","fonti":[{"i":"olympics.com","t":"When were the first Olympic Winter Games held?","u":"https://www.olympics.com/ioc/faq/history-and-origin-of-the-games/when-were-the-first-olympic-winter-games-held"},{"i":"olympics.com","t":"Chamonix 1924 Winter Olympics","u":"https://www.olympics.com/en/olympic-games/chamonix-1924"}],"italia":false,"nota":""},{"id":"sci-fis","sport":"sci","anno":1924,"data":"2 febbraio 1924","circa":false,"titolo":"Nasce la FIS","testo":"Il 2 febbraio 1924, durante i Giochi di Chamonix, 14 nazioni fondano la Federazione internazionale dello sci, erede della commissione nata a Christiania (Oslo) nel 1910.","luogo":"Chamonix (Francia)","fonti":[{"i":"FIS","t":"History of FIS","u":"https://www.fis-ski.com/en/inside-fis/about-fis/history/history-of-fis"}],"italia":false,"nota":""},{"id":"calcio-mondiale-1930","sport":"calcio","anno":1930,"data":"","circa":false,"titolo":"Il primo Mondiale","testo":"In Uruguay si gioca il primo Campionato del mondo, con 13 squadre. Il 30 luglio, a Montevideo, l'Uruguay batte l'Argentina 4-2 in finale.","luogo":"Montevideo","fonti":[{"i":"FIFA","t":"FIFA World Cup champions: 1930-1978","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/world-cup-champions-1930-1978-uruguay-italy-germany-brazil-england-argentina"}],"italia":false,"nota":""},{"id":"ciclismo-maglia-rosa","sport":"ciclismo","anno":1931,"data":"","circa":false,"titolo":"Nasce la maglia rosa","testo":"Nel 1931 Armando Cougnet, giornalista della Gazzetta dello Sport, introduce una maglia rosa per riconoscere subito il primo della classifica.","luogo":"","fonti":[{"i":"Giro d'Italia","t":"90 Years of the Maglia Rosa","u":"https://www.giroditalia.it/en/magliarosa/"}],"italia":true,"nota":""},{"id":"sci-murren-1931","sport":"sci","anno":1931,"data":"20–23 febbraio 1931","circa":false,"titolo":"I primi Mondiali di sci alpino","testo":"Dal 20 al 23 febbraio 1931 Mürren, in Svizzera, ospita i primi Mondiali di sci alpino: discesa e slalom, maschili e femminili. Tra i paesi in gara c'è anche l'Italia.","luogo":"Mürren (Svizzera)","fonti":[{"i":"FIS","t":"Where it all began: Mürren 1931","u":"https://100.fis-ski.com/moments/where-it-all-began-muerren-1931"}],"italia":false,"nota":""},{"id":"basket-fiba","sport":"basket","anno":1932,"data":"18 giugno 1932","circa":false,"titolo":"Nasce la FIBA","testo":"Il 18 giugno 1932, a Ginevra, otto federazioni nazionali (Argentina, Cecoslovacchia, Grecia, Italia, Lettonia, Portogallo, Romania e Svizzera) fondano la Federazione internazionale di basket e approvano regole comuni.","luogo":"Ginevra (Svizzera)","fonti":[{"i":"FIBA","t":"FIBA celebrates 85th anniversary","u":"https://www.fiba.basketball/en/news/fiba-celebrates-85th-anniversary"},{"i":"FIBA","t":"8 Founding Federations","u":"https://about.fiba.basketball/en/fiba-hall-of-fame/hall-of-famers/8-founding-federations"}],"italia":true,"nota":""},{"id":"calcio-italia-1934","sport":"calcio","anno":1934,"data":"","circa":false,"titolo":"Italia campione del mondo","testo":"L'Italia di Vittorio Pozzo vince il Mondiale di casa battendo la Cecoslovacchia 2-1 ai supplementari a Roma. Nel 1938, in Francia, rivince: è la prima squadra a confermarsi campione.","luogo":"Roma","fonti":[{"i":"FIFA","t":"FIFA World Cup champions: 1930-1978","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/world-cup-champions-1930-1978-uruguay-italy-germany-brazil-england-argentina"},{"i":"FIFA","t":"The back-to-back champions","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/italy-brazil-consecutive-titles"}],"italia":true,"nota":""},{"id":"basket-berlino-1936","sport":"basket","anno":1936,"data":"","circa":false,"titolo":"Il basket arriva alle Olimpiadi","testo":"A Berlino il basket entra nel programma olimpico. Si gioca all'aperto su campi in terra: la finale si disputa sotto la pioggia e gli Stati Uniti battono il Canada 19-8.","luogo":"Berlino","fonti":[{"i":"olympics.com","t":"Olympic basketball's muddy beginnings","u":"https://www.olympics.com/en/news/olympic-basketball-s-muddy-beginnings"},{"i":"FIBA","t":"Olympic Games: Berlin 1936","u":"https://www.fiba.basketball/en/news/olympic-games-berlin-1936"}],"italia":false,"nota":""},{"id":"owens-1936","sport":"atletica","anno":1936,"data":"","circa":false,"titolo":"Owens, quattro ori a Berlino","testo":"Ai Giochi di Berlino Jesse Owens vince 100 m, 200 m, salto in lungo e staffetta 4×100. Il record di quattro ori nell'atletica in una sola edizione resterà ineguagliato fino a Carl Lewis, a Los Angeles 1984.","luogo":"Berlino","fonti":[{"i":"olympics.com","t":"Berlin 1936 Summer Olympics","u":"https://www.olympics.com/en/olympic-games/berlin-1936"},{"i":"olympics.com","t":"Jesse Owens – biografia","u":"https://www.olympics.com/en/athletes/jesse-owens"}],"italia":false,"nota":""},{"id":"basket-nba","sport":"basket","anno":1946,"data":"","circa":false,"titolo":"Nasce la lega che diventerà la NBA","testo":"Nel 1946 a New York nasce la Basketball Association of America, che gioca la prima partita il 1° novembre. Nel 1949 si fonde con la National Basketball League: nasce la NBA.","luogo":"New York","fonti":[{"i":"Britannica","t":"National Basketball Association (NBA)","u":"https://www.britannica.com/topic/National-Basketball-Association"},{"i":"NBA","t":"About the NBA","u":"https://www.nba.com/news/about"}],"italia":false,"nota":""},{"id":"volley-fivb","sport":"pallavolo","anno":1947,"data":"","circa":false,"titolo":"Nasce la FIVB","testo":"Nell'aprile 1947 a Parigi quattordici federazioni, tra cui l'Italia, fondano la Federazione internazionale di pallavolo. Dal 1984 ha sede a Losanna.","luogo":"Parigi","fonti":[{"i":"FIVB","t":"Volleyball's Century: The FIVB Legacy","u":"https://www.fivb.com/inside-fivb/fivb/history/"},{"i":"FIVB","t":"Volleyball History - Men's World Cup 2015","u":"http://worldcup.2015.men.fivb.com/en/competition/volleyballhistory"}],"italia":true,"nota":""},{"id":"volley-mondiale-1949","sport":"pallavolo","anno":1949,"data":"","circa":false,"titolo":"Il primo Mondiale","testo":"A settembre Praga ospita il primo Campionato del mondo maschile: vince l'Unione Sovietica davanti a Cecoslovacchia e Bulgaria. Il Mondiale femminile arriverà nel 1952.","luogo":"Praga","fonti":[{"i":"Volleyball World","t":"Men's World Championship by the numbers","u":"https://en.volleyballworld.com/volleyball/competitions/men-world-championship/2022/news/men-s-world-championship-by-the-numbers"},{"i":"FIVB","t":"Volleyball's Century: The FIVB Legacy","u":"https://www.fivb.com/inside-fivb/fivb/history/"}],"italia":false,"nota":""},{"id":"motori-f1-1950","sport":"motori","anno":1950,"data":"13 maggio 1950","circa":false,"titolo":"Il primo Gran Premio di Formula 1","testo":"Il 13 maggio 1950 a Silverstone si corre la prima gara del Mondiale di Formula 1. Vince l'italiano Giuseppe «Nino» Farina su Alfa Romeo, che a fine anno sarà il primo campione del mondo.","luogo":"Silverstone (Inghilterra)","fonti":[{"i":"Formula 1","t":"Ten fascinating facts about the very first F1 race","u":"https://www.formula1.com/en/latest/article/f1-first-race-1950-silverstone.2f2zI6BmGT9bnK4vX10paZ"},{"i":"Formula 1","t":"Great Britain - Silverstone","u":"https://www.formula1.com/en/information/great-britain-silverstone-circuit.2DtFVI1FjkYgLVdGhbAIv0"}],"italia":true,"nota":""},{"id":"bannister-1954","sport":"atletica","anno":1954,"data":"6 maggio 1954","circa":false,"titolo":"Il primo miglio sotto i 4 minuti","testo":"Il 6 maggio 1954, in una gara a Oxford, lo studente di medicina inglese Roger Bannister corre il miglio in 3'59\"4: è il primo uomo sotto i quattro minuti.","luogo":"Oxford (Regno Unito)","fonti":[{"i":"Britannica","t":"Roger Bannister","u":"https://www.britannica.com/biography/Roger-Bannister"}],"italia":false,"nota":""},{"id":"pele-1958","sport":"calcio","anno":1958,"data":"29 giugno 1958","circa":false,"titolo":"Pelé, campione a 17 anni","testo":"In Svezia il Brasile vince il suo primo Mondiale battendo i padroni di casa 5-2 in finale. Pelé, 17 anni, segna due gol: è ancora il più giovane marcatore in una finale mondiale.","luogo":"Solna (Svezia)","fonti":[{"i":"FIFA","t":"Brazil v Sweden, 1958","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/brazil-sweden-1958"},{"i":"FIFA","t":"Behind the World Cup record: Pele","u":"https://inside.fifa.com/tournaments/mens/worldcup/1958sweden/news/behind-the-world-cup-record-pele"}],"italia":false,"nota":""},{"id":"bikila-1960","sport":"atletica","anno":1960,"data":"10 settembre 1960","circa":false,"titolo":"Bikila, maratona a piedi nudi","testo":"A Roma l'etiope Abebe Bikila vince la maratona olimpica correndo scalzo, in 2h15'16\": è il primo africano nero campione olimpico della maratona. Quattro anni dopo, a Tokyo, vincerà di nuovo.","luogo":"Roma","fonti":[{"i":"olympics.com","t":"Abebe Bikila wins men's marathon barefoot","u":"https://www.olympics.com/en/news/this-week-in-olympic-history-9-15-september-abebe-bikila-wins-mens-marathon-barefoot"},{"i":"olympics.com","t":"Abebe Bikila – biografia","u":"https://www.olympics.com/en/athletes/abebe-bikila"}],"italia":false,"nota":""},{"id":"roma-1960-paralimpiadi","sport":"olimpiadi","anno":1960,"data":"18–25 settembre 1960","circa":false,"titolo":"Roma 1960, le prime Paralimpiadi","testo":"Dal 18 al 25 settembre 1960, sei giorni dopo la chiusura delle Olimpiadi, Roma ospita i primi Giochi paralimpici, organizzati da Ludwig Guttmann e dal neurochirurgo italiano Antonio Maglio.","luogo":"Roma","fonti":[{"i":"paralympic.org","t":"Rome 1960","u":"https://www.paralympic.org/rome-1960"},{"i":"paralympic.org","t":"Paralympic Games","u":"https://www.paralympic.org/paralympic-games"}],"italia":true,"nota":"Partecipanti: l'IPC indica 400 atleti da 23 paesi nella pagina generale e 319 atleti da 21 paesi nella pagina dedicata a Roma 1960; nel testo non c'è il numero."},{"id":"chamberlain-1962","sport":"basket","anno":1962,"data":"2 marzo 1962","circa":false,"titolo":"Chamberlain, 100 punti","testo":"A Hershey, in Pennsylvania, Wilt Chamberlain segna 100 punti nella vittoria dei Philadelphia Warriors sui New York Knicks (169-147). È ancora il record NBA in una partita.","luogo":"Hershey (Stati Uniti)","fonti":[{"i":"NBA","t":"Top Moments: Wilt Chamberlain scores 100","u":"https://www.nba.com/news/history-top-moments-wilt-chamberlain-scores-100"}],"italia":false,"nota":""},{"id":"volley-tokyo-1964","sport":"pallavolo","anno":1964,"data":"","circa":false,"titolo":"La pallavolo diventa olimpica","testo":"A Tokyo 1964 la pallavolo debutta ai Giochi, maschile e femminile insieme. Vincono l'Unione Sovietica tra gli uomini e il Giappone tra le donne, che in finale batte proprio l'URSS.","luogo":"Tokyo","fonti":[{"i":"olympics.com","t":"Volleyball: a brief history","u":"https://www.olympics.com/en/news/volleyball-a-brief-history"},{"i":"olympics.com","t":"Bewitched: Japan's 1964 gold in women's volleyball","u":"https://www.olympics.com/en/news/tokyo-1964-women-volleyball-japan-gold"}],"italia":false,"nota":""},{"id":"sci-coppa-1967","sport":"sci","anno":1967,"data":"5 gennaio 1967","circa":false,"titolo":"Nasce la Coppa del Mondo","testo":"Il 5 gennaio 1967 a Berchtesgaden si corre la prima gara della Coppa del Mondo di sci alpino, nata da un'idea del giornalista francese Serge Lang. La prima stagione conta 17 gare.","luogo":"Berchtesgaden (Germania)","fonti":[{"i":"FIS","t":"Alpine World Cup turns 60","u":"https://www.fis-ski.com/alpine-skiing/news/2026-27/crystal-globes-prominent-calendars-wild-cards-confirmed-alpine-world-cup-turns-60"},{"i":"FIS","t":"The Ski World Cup, a success story","u":"https://100.fis-ski.com/moments/the-ski-world-cup-a-success-story"}],"italia":false,"nota":""},{"id":"beamon-1968","sport":"atletica","anno":1968,"data":"18 ottobre 1968","circa":false,"titolo":"Beamon, 8,90 nel lungo","testo":"Ai Giochi di Città del Messico Bob Beamon salta 8,90 m al primo tentativo della finale e migliora il record del mondo di 55 centimetri. Resta tuttora il record olimpico.","luogo":"Città del Messico","fonti":[{"i":"olympics.com","t":"Beamon breaks World and Olympic record","u":"https://www.olympics.com/en/news/week-in-olympic-history-14-20-october"},{"i":"olympics.com","t":"Olympic jump records","u":"https://www.olympics.com/en/news/olympic-records-jump-high-long-triple-pole-vault"}],"italia":false,"nota":""},{"id":"tennis-open","sport":"tennis","anno":1968,"data":"","circa":false,"titolo":"Comincia l'era Open","testo":"Nel marzo 1968 la federazione internazionale approva i primi tornei aperti sia ai dilettanti sia ai professionisti: comincia l'era Open.","luogo":"","fonti":[{"i":"Britannica","t":"Tennis - Professional and open tennis","u":"https://www.britannica.com/sports/tennis/Professional-and-open-tennis"},{"i":"Britannica","t":"What Is the Open Era in Tennis?","u":"https://www.britannica.com/sports/What-Is-the-Open-Era-in-Tennis"}],"italia":false,"nota":""},{"id":"laver-1969","sport":"tennis","anno":1969,"data":"","circa":false,"titolo":"Laver, il secondo Grande Slam","testo":"L'australiano Rod Laver vince nello stesso anno Australian Open, Roland Garros, Wimbledon e US Open, come nel 1962. È l'unico ad averlo fatto due volte, e l'unico uomo nell'era Open.","luogo":"","fonti":[{"i":"Britannica","t":"Rod Laver","u":"https://www.britannica.com/biography/Rod-Laver"},{"i":"ATP Tour","t":"Grand Slams: Tournaments, Records, Stats","u":"https://www.atptour.com/en/news/grand-slams-tournaments-records-stats"}],"italia":false,"nota":""},{"id":"merckx-1969","sport":"ciclismo","anno":1969,"data":"","circa":false,"titolo":"Merckx vince il primo Tour","testo":"Il belga Eddy Merckx vince il suo primo Tour de France; ne vincerà cinque (1969-72 e 1974), oltre a cinque Giri d'Italia e una Vuelta. In carriera conterà 445 vittorie.","luogo":"Francia","fonti":[{"i":"Britannica","t":"Eddy Merckx","u":"https://www.britannica.com/biography/Eddy-Merckx"}],"italia":false,"nota":""},{"id":"brasile-1970","sport":"calcio","anno":1970,"data":"21 giugno 1970","circa":false,"titolo":"La Coppa Rimet resta al Brasile","testo":"Battendo l'Italia 4-1 in finale a Città del Messico, il Brasile vince il terzo Mondiale e tiene per sempre la Coppa Jules Rimet. Dal 1974 si gioca per un trofeo nuovo.","luogo":"Città del Messico","fonti":[{"i":"Britannica","t":"Jules Rimet Trophy","u":"https://www.britannica.com/sports/Jules-Rimet-Trophy"},{"i":"FIFA","t":"The World Cup Trophy in numbers","u":"https://www.fifa.com/en/articles/world-cup-trophy-in-numbers-fifa-world-cup-qatar-2022"}],"italia":false,"nota":""},{"id":"spitz-1972","sport":"nuoto","anno":1972,"data":"","circa":false,"titolo":"Spitz, sette ori e sette record","testo":"A Monaco di Baviera Mark Spitz vince sette gare su sette, tutte con il record del mondo. Il primato di ori in una sola edizione durerà 36 anni.","luogo":"Monaco di Baviera","fonti":[{"i":"olympics.com","t":"Mark Spitz – biografia","u":"https://www.olympics.com/en/athletes/mark-spitz"},{"i":"olympics.com","t":"Munich 1972 Summer Olympics","u":"https://www.olympics.com/en/olympic-games/munich-1972"}],"italia":false,"nota":""},{"id":"nuoto-mondiali-1973","sport":"nuoto","anno":1973,"data":"","circa":false,"titolo":"I primi Mondiali di nuoto","testo":"Nel 1973 Belgrado ospita i primi Campionati del mondo di nuoto, pallanuoto, tuffi e nuoto sincronizzato.","luogo":"Belgrado","fonti":[{"i":"World Aquatics","t":"Overview and history","u":"https://www.worldaquatics.com/content/overview-and-history"}],"italia":false,"nota":""},{"id":"basket-donne-1976","sport":"basket","anno":1976,"data":"","circa":false,"titolo":"Il basket femminile alle Olimpiadi","testo":"A Montréal 1976 debutta il torneo olimpico femminile: vince l'Unione Sovietica, che in finale batte gli Stati Uniti.","luogo":"Montréal (Canada)","fonti":[{"i":"FIBA","t":"Tokyo 2020 by numbers","u":"https://www.fiba.basketball/en/news/olympics-men-2020-news-tokyo-2020-by-numbers-stats-and-facts-from-the-olympic-basketball-tournaments"},{"i":"Wikipedia","t":"Basketball at the Summer Olympics (rev. 1383154364)","u":"https://en.wikipedia.org/w/index.php?title=Basketball_at_the_Summer_Olympics&oldid=1383154364"}],"italia":false,"nota":""},{"id":"comaneci-1976","sport":"ginnastica","anno":1976,"data":"18 luglio 1976","circa":false,"titolo":"Comăneci, il primo 10","testo":"A Montréal la romena Nadia Comăneci, 14 anni, ottiene alle parallele asimmetriche il primo 10 della storia olimpica. Il tabellone, che non prevedeva il 10, mostra «1.00». Ne prenderà altri sei in quei Giochi.","luogo":"Montréal","fonti":[{"i":"olympics.com","t":"Nadia Comaneci scores the first perfect 10","u":"https://www.olympics.com/en/news/this-week-in-olympic-history-july-15-21-nadia-comaneci-scores-the-first-perfect-10-in-gymnastics"},{"i":"olympics.com","t":"Nadia Comaneci – biografia","u":"https://www.olympics.com/en/athletes/nadia-comaneci"}],"italia":false,"nota":""},{"id":"tennis-davis-1976","sport":"tennis","anno":1976,"data":"","circa":false,"titolo":"Italia, prima Coppa Davis","testo":"A dicembre, a Santiago del Cile, l'Italia di Adriano Panatta e Corrado Barazzutti batte il Cile 4-1 e vince la sua prima Coppa Davis.","luogo":"Santiago del Cile","fonti":[{"i":"Davis Cup","t":"Previous Champions","u":"https://www.daviscup.com/en/previous-champions"},{"i":"Davis Cup","t":"Italy Davis Cup team profile","u":"https://www.daviscup.com/en/news/italy-team-profile-article"}],"italia":true,"nota":""},{"id":"calcio-italia-1982","sport":"calcio","anno":1982,"data":"11 luglio 1982","circa":false,"titolo":"Campioni del mondo in Spagna","testo":"L'11 luglio 1982, al Bernabéu di Madrid, l'Italia batte la Germania Ovest 3-1 e vince il suo terzo Mondiale, il primo dal 1938.","luogo":"Madrid","fonti":[{"i":"FIFA","t":"FIFA World Cup champions: 1982-2026","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/world-cup-champions-1982-2026-italy-argentina-germany-brazil-france-spain"}],"italia":true,"nota":""},{"id":"atletica-mondiali-1983","sport":"atletica","anno":1983,"data":"7–14 agosto 1983","circa":false,"titolo":"I primi Mondiali di atletica","testo":"Dal 7 al 14 agosto 1983 Helsinki ospita i primi Campionati del mondo: 1.355 atleti da 153 paesi. Fino ad allora il titolo mondiale era, di fatto, quello olimpico.","luogo":"Helsinki","fonti":[{"i":"World Athletics","t":"1980s to end of 20th Century","u":"https://worldathletics.org/heritage/history/1980s-to-end-of-20th-century"},{"i":"World Athletics","t":"History of the World Athletics Championships","u":"https://worldathletics.org/en/competitions/world-athletics-championships/world-athletics-championships-tokyo-2025-7190593/event-info/world-athletics-history"}],"italia":false,"nota":""},{"id":"basket-euro-1983","sport":"basket","anno":1983,"data":"","circa":false,"titolo":"Italia campione d'Europa","testo":"Agli Europei in Francia l'Italia di Sandro Gamba vince tutte le sette partite e conquista il suo primo titolo europeo; in finale c'è la Spagna.","luogo":"Francia (Limoges, Caen, Nantes)","fonti":[{"i":"FIBA","t":"All-Time Medalists - FIBA EuroBasket","u":"https://www.fiba.basketball/en/events/fiba-eurobasket-2025/all-time-medalists"},{"i":"FIBA","t":"Top Five Italy Teams of All Time","u":"https://www.fiba.basketball/en/news/top-five-italy-teams-all-time"}],"italia":true,"nota":""},{"id":"maradona-1986","sport":"calcio","anno":1986,"data":"22 giugno 1986","circa":false,"titolo":"Maradona e il «gol del secolo»","testo":"Nei quarti del Mondiale messicano Diego Maradona segna all'Inghilterra il gol di mano e, quattro minuti dopo, quello partito da metà campo poi votato gol del secolo. L'Argentina vincerà il Mondiale.","luogo":"Città del Messico","fonti":[{"i":"FIFA","t":"Diego Maradona spurs Argentina past England at Mexico 1986","u":"https://www.fifa.com/en/tournaments/mens/worldcup/articles/argentina-england-1986-diego-maradona"},{"i":"Britannica","t":"Diego Maradona","u":"https://www.britannica.com/biography/Diego-Maradona"}],"italia":false,"nota":""},{"id":"beach-fivb-1987","sport":"beach","anno":1987,"data":"","circa":false,"titolo":"Il primo torneo FIVB","testo":"Nel 1987 si gioca il primo torneo di beach volley riconosciuto dalla federazione internazionale. Nove anni dopo il beach volley sarà olimpico.","luogo":"","fonti":[{"i":"FIVB","t":"FIVB celebrates 75th Anniversary","u":"https://www.fivb.com/fivb-celebrates-75th-anniversary/"}],"italia":false,"nota":""},{"id":"graf-1988","sport":"tennis","anno":1988,"data":"","circa":false,"titolo":"Graf, il Golden Slam","testo":"Steffi Graf vince i quattro tornei del Grande Slam e poi l'oro olimpico a Seul, battendo in finale Gabriela Sabatini. È l'unica ad aver vinto tutto nello stesso anno.","luogo":"Seul","fonti":[{"i":"olympics.com","t":"Tennis' first Golden Slam winner: Steffi Graf","u":"https://www.olympics.com/en/news/tennis-golden-slam-steffi-graf-1988-olympics-gold"},{"i":"Britannica","t":"Steffi Graf","u":"https://www.britannica.com/biography/Steffi-Graf"}],"italia":false,"nota":""},{"id":"volley-fenomeni","sport":"pallavolo","anno":1990,"data":"","circa":false,"titolo":"La «generazione dei fenomeni»","testo":"Con Julio Velasco in panchina l'Italia vince il Mondiale 1990 a Rio de Janeiro. È il primo di tre titoli mondiali di fila: poi Atene 1994 e Tokyo 1998.","luogo":"Rio de Janeiro","fonti":[{"i":"Volleyball World","t":"Worlds' roll of honour: 1949-2018","u":"https://en.volleyballworld.com/volleyball/competitions/men-world-championship/2022/news/men-s-world-championship-roll-of-honour"},{"i":"olympics.com","t":"De Giorgi, Velasco e Giani: dalla Generazione dei Fenomeni a Parigi 2024","u":"https://www.olympics.com/it/notizie/pallavolo-degiorgi-giani-velasco-olimpiadi-parigi-2024-generazione-fenomeni"}],"italia":true,"nota":""},{"id":"calcio-donne-1991","sport":"calcio","anno":1991,"data":"","circa":false,"titolo":"Il primo Mondiale femminile","testo":"La FIFA organizza in Cina il primo Campionato del mondo femminile.","luogo":"Cina","fonti":[{"i":"FIFA","t":"We are FIFA","u":"https://jobs.fifa.com/we-are-fifa"}],"italia":false,"nota":""},{"id":"dream-team-1992","sport":"basket","anno":1992,"data":"","circa":false,"titolo":"Il Dream Team","testo":"Barcellona 1992 è la prima Olimpiade aperta ai giocatori NBA. Gli Stati Uniti di Jordan, Magic Johnson, Bird e Barkley vincono l'oro battendo gli avversari con una media di 44 punti di scarto.","luogo":"Barcellona","fonti":[{"i":"olympics.com","t":"Dream Team 1992 Revisited","u":"https://www.olympics.com/en/news/dream-team-1992-usa-basketball-olympics"},{"i":"olympics.com","t":"The Barcelona 1992 Dream Team","u":"https://www.olympics.com/en/topics/this-is-the-dream-team"}],"italia":false,"nota":""},{"id":"beach-atlanta-1996","sport":"beach","anno":1996,"data":"","circa":false,"titolo":"Il beach volley diventa olimpico","testo":"Dopo la prova dimostrativa di Barcellona 1992, il beach volley entra nei Giochi ad Atlanta: oltre 107.000 spettatori in sei giorni. Vincono Karch Kiraly e Kent Steffes (USA) e Jackie Silva e Sandra Pires (Brasile).","luogo":"Atlanta (USA)","fonti":[{"i":"FIVB","t":"Beach volleyball marks 30 years as an Olympic sport","u":"https://www.fivb.com/beach-volleyball-marks-30-years-as-an-olympic-sport/"},{"i":"olympics.com","t":"Beach volleyball rules: All you need to know","u":"https://www.olympics.com/en/news/beach-volleyball-indoor-difference-rules-history-olympics"}],"italia":false,"nota":""},{"id":"beach-mondiali-1997","sport":"beach","anno":1997,"data":"","circa":false,"titolo":"I primi Mondiali di beach volley","testo":"L'anno dopo il debutto olimpico la FIVB organizza i primi Campionati del mondo di beach volley.","luogo":"","fonti":[{"i":"olympics.com","t":"History of volleyball: From origins to the Olympics","u":"https://www.olympics.com/en/news/what-history-volleyball-game-origin-mintonette-ymca-fivb-olympics"}],"italia":false,"nota":"La sede non è stata verificata in questa sessione e non è indicata."},{"id":"basket-euro-1999","sport":"basket","anno":1999,"data":"","circa":false,"titolo":"Di nuovo campioni d'Europa","testo":"Agli Europei del 1999, ancora in Francia, l'Italia vince il suo secondo titolo battendo la Spagna; Gregor Fučka è il miglior giocatore del torneo.","luogo":"Francia (finale a Parigi)","fonti":[{"i":"FIBA","t":"All-Time Medalists - FIBA EuroBasket","u":"https://www.fiba.basketball/en/events/fiba-eurobasket-2025/all-time-medalists"}],"italia":true,"nota":"Che la Spagna sia la finalista viene dalla tabella FIBA (Italia prima, Spagna seconda)."},{"id":"cuba-volley-2000","sport":"pallavolo","anno":2000,"data":"","circa":false,"titolo":"Cuba, tre ori di fila","testo":"Con il successo di Sydney 2000 la nazionale femminile cubana, quella di Regla Torres e Mireya Luis, vince il terzo oro olimpico consecutivo dopo Barcellona 1992 e Atlanta 1996. Nessun'altra squadra femminile ci è riuscita.","luogo":"Sydney","fonti":[{"i":"FIVB","t":"Cuba aim to reignite past /* ---------- vista: spostamento e zoom ---------- */

/* trascinamento, due dita, rotella */

(function () {

})();
function aggiorna(v) { const u = new URL(location.href); u.searchParams.set('v', v || Date.now().toString(36)); location.replace(u.toString()); }
let ultimoControllo = 0, nuovaV = '';
function controllaVersione() {
  if (!VERSIONE || Date.now() - ultimoControllo < 120000) return;
  ultimoControllo = Date.now();
  fetch('versione.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (j && j.v && j.v !== VERSIONE) { nuovaV = j.v; $('nuova').classList.add('on'); }
  }).catch(() => {});
}
$('bAggiorna').onclick = () => aggiorna(nuovaV);
document.addEventListener('visibilitychange', () => { if (!document.hidden) controllaVersione(); });
addEventListener('focus', controllaVersione);
setTimeout(controllaVersione, 4000);

/* ---------- avvio ---------- */
inizio();
function daIndirizzo() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('cerca')) { if (!cercaAperta() || $('q').value !== h.get('cerca')) apriCerca(h.get('cerca')); return; }
  chiudiCerca(true);
  if (h.get('atleta')) { if (!ATLETA || ATLETA.id !== h.get('atleta')) apriAtleta(h.get('atleta')); return; }
  if (VIS.length < SP.length) esciVista();
  if (h.get('voce')) apriVoce(h.get('voce'), true);
  else if (h.get('sport')) {
    const a = DATI.albi[h.get('sport')], gi = a ? Math.max(0, a.gruppi.findIndex(g => g.id === h.get('g'))) : 0;
    apriSport(h.get('sport'), gi, +(h.get('t') || 0), h.get('r'));
  } else if (location.hash === '#albi') apriAlbi();
}
daIndirizzo();
addEventListener('hashchange', daIndirizzo);
setTimeout(() => $('hint').classList.add('off'), 6000);
</script>
</body>
</html>
