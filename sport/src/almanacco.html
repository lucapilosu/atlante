<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilu Sports Almanac</title>
<link rel="icon" href="../favicon-32.png">
<style>
:root{--bg:#0e191d;--bg2:#13232a;--panel:#172b32;--line:#25404a;--text:#ece6d6;--muted:#8fa6ad;--accent:#f0b44c;--gut:58px;--top:52px;--head:44px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.bar{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:30}
.bar .back{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.bar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bar h1 .anni{color:var(--accent);font-weight:700;margin-left:.35em}
.bar .btn{background:#1f3740;border:1px solid var(--line);border-radius:8px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font-size:14px}
.bar .btn:hover{background:#27454f}
#stage{position:fixed;left:0;right:0;top:var(--top);bottom:0;overflow:hidden;touch-action:none;cursor:grab;background:
 radial-gradient(ellipse at 50% 0%,#14262d,var(--bg) 70%)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.colbg{position:absolute;top:0;border-left:1px solid rgba(255,255,255,.04)}
.colbg.alt{background:rgba(255,255,255,.018)}
.guide{position:absolute;width:2px;border-radius:2px;opacity:.35}
.decade{position:absolute;left:0;height:1px;background:rgba(255,255,255,.05)}
.band{position:absolute;left:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 10px,transparent 10px 20px);border-top:1px dashed rgba(240,180,76,.35)}
.band span{position:absolute;left:10px;top:8px;font-size:22px;font-weight:700;color:rgba(240,180,76,.55);letter-spacing:.04em}
.pin{position:absolute;width:9px;height:9px;border-radius:50%;margin:-4.5px 0 0 -4.5px;border:2px solid var(--bg)}
.link{position:absolute;height:1px;opacity:.5}
.tile{position:absolute;width:180px;height:76px;padding:7px 9px 7px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line);border-left-width:5px;cursor:pointer;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tile:hover{background:#1d3640}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile .y{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.tile .t{font-size:14px;font-weight:650;line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ita{position:absolute;right:7px;top:8px;width:18px;height:5px;border-radius:2px;background:linear-gradient(90deg,#1f9c4b 0 33%,#fff 33% 66%,#d23a3a 66%)}
#world.far .tile .t{display:none}
#world.far .tile .y{font-size:22px;margin-top:6px}
#heads{position:fixed;left:var(--gut);right:0;top:var(--top);height:var(--head);z-index:20;overflow:hidden;pointer-events:none;background:linear-gradient(var(--bg2),rgba(19,35,42,.92));border-bottom:1px solid var(--line)}
.head{position:absolute;top:0;height:var(--head);display:flex;align-items:center;gap:6px;padding:0 8px;pointer-events:auto;cursor:pointer;border-top:4px solid;white-space:nowrap;overflow:hidden}
.head:hover{background:rgba(255,255,255,.05)}
.head svg{flex:none;width:22px;height:22px}
.head b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.head .albo{font-size:10px;color:var(--accent);border:1px solid rgba(240,180,76,.5);border-radius:4px;padding:0 4px}
#gutter{position:fixed;left:0;top:var(--top);bottom:0;width:var(--gut);z-index:19;overflow:hidden;pointer-events:none;background:linear-gradient(90deg,var(--bg2) 70%,rgba(19,35,42,0))}
#gutter span{position:absolute;left:6px;font-size:12px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
#gutter span.b{color:var(--text);font-weight:700}
#gutter .corner{position:absolute;left:0;top:0;width:var(--gut);height:var(--head);background:var(--bg2);border-bottom:1px solid var(--line)}
/* scheda */
#panel{position:fixed;z-index:40;background:var(--bg2);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.35);overflow:auto;-webkit-overflow-scrolling:touch;right:0;top:var(--top);bottom:0;width:min(440px,100vw);transform:translateX(105%);transition:transform .22s ease-out}
#panel.open{transform:none}
@media (max-width:700px){
 #panel{left:0;right:0;top:auto;width:auto;height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
 #panel.open{transform:none}
 .bar h1{font-size:14px}
 .bar{gap:6px;padding:0 8px}
 .bar .btn{padding:0 8px;font-size:13px}
 .lungo{display:none}
 .bar .back{display:none}
 .bar .btn.z{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
.pin-close{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px 16px;background:var(--bg2);z-index:1}
.pin-close button{background:#1f3740;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 6px;border-radius:999px;background:#1f3740;cursor:pointer;border:0}
.chip svg{width:16px;height:16px}
.body{padding:2px 16px 24px}
.body h2{margin:6px 0 2px;font-size:21px;line-height:1.2}
.meta{color:var(--accent);font-weight:600;font-size:14px}
.meta .luogo{color:var(--muted);font-weight:400}
.body p{margin:10px 0}
.body h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.fonti{margin:0;padding-left:18px;font-size:13.5px}
.fonti li{margin:3px 0}
.fonti .ist{color:var(--muted)}
.nota{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:10px 0}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:#1f3740;margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{border:1px solid var(--line);background:#1f3740;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--accent);color:#1b1b1b;border-color:var(--accent);font-weight:700}
table.albo{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.albo col.c-a{width:62px}table.albo col.c-r{width:58px}
table.albo td{overflow-wrap:anywhere}
table.albo th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 4px;border-bottom:1px solid var(--line);position:sticky;top:50px;background:var(--bg2)}
table.albo td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
table.albo td.a{font-weight:700;color:var(--accent);white-space:nowrap}
table.albo td.r{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
table.albo td .sede{display:block;color:var(--muted);font-size:11.5px}
table.albo tr.ita td{background:rgba(31,156,75,.12)}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.lista li:hover{color:var(--accent)}
.lista .ly{width:58px;flex:none;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.albi-lista button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#1f3740;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.albi-lista svg{width:26px;height:26px;flex:none}
.foot{font-size:12px;color:var(--muted);margin-top:22px}
.hint{position:fixed;left:50%;bottom:16px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);z-index:25;background:rgba(19,35,42,.95);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--muted);pointer-events:none;transition:opacity .4s}
.hint.off{opacity:0}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../">← Atlante</a>
  <h1 id="titolo">Pilu Sports Almanac<span class="anni"></span></h1>
  <button class="btn" id="bAlbi" type="button" title="Albi d'oro">Albi<span class="lungo"> d'oro</span></button>
  <button class="btn z" id="bMeno" type="button" title="Allontana" aria-label="Allontana">−</button>
  <button class="btn z" id="bPiu" type="button" title="Avvicina" aria-label="Avvicina">+</button>
  <button class="btn" id="bTutto" type="button" title="Tutto l'almanacco">Tutto</button>
</header>
<div id="stage" aria-label="Mosaico degli sport: trascina per muoverti, rotella o due dita per lo zoom"><div id="world"></div></div>
<div id="heads"></div>
<div id="gutter"><div class="corner"></div></div>
<aside id="panel" aria-live="polite"></aside>
<div class="hint" id="hint">Trascina<span class="lungo"> per muoverti</span> · tocca una tessera · tocca uno sport per l'albo</div>
<script>
const DATI = /*DATI*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- anni del titolo: dal primo anno moderno all'ultimo con risultati ---------- */
const DA = 1896;
const ULTIMO = Math.max(...DATI.voci.map(v => v.anno), ...Object.values(DATI.albi).flatMap(a => a.tornei.flatMap(t => t.righe.map(r => r.anno))));
$('titolo').querySelector('.anni').textContent = DA + '–' + ULTIMO;
document.title = 'Pilu Sports Almanac ' + DA + '–' + ULTIMO;

/* ---------- pittogrammi (disegni originali, semplici) ---------- */
const ICONE = {
  globo: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  basket: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3v18M6 5.5c3 3 3 10 0 13M18 5.5c-3 3-3 10 0 13" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  volley: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12c-1-4-4-7-8-5M12 12c4-1 7-4 5-8M12 12c3 3 3 7 0 9" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  beach: '<circle cx="17" cy="6" r="3" fill="currentColor"/><path d="M4 9v10M16 13v6M4 9h12v4H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 20q10-3 20 0" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  pista: '<rect x="3" y="6" width="18" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="7" y="9.5" width="10" height="5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  calcio: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4z" fill="currentColor"/><path d="M12 8V3.5M15.5 10.5l4-1.5M14.2 14.5l2.5 3.5M9.8 14.5l-2.5 3.5M8.5 10.5l-4-1.5" stroke="currentColor" stroke-width="1.2"/>',
  bici: '<circle cx="6" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 15l4-7h6l2 7M10 8l3 7h-7M14 6h3" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  tennis: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 5.5c4 3 4 10 0 13M19 5.5c-4 3-4 10 0 13" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  scacchi: '<rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 4h4v4H4zM12 4h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM8 16h4v4H8zM16 16h4v4h-4z" fill="currentColor"/>',
  sci: '<path d="M4 20l16-8M6 22l16-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="5" r="2" fill="currentColor"/><path d="M14 7l-3 5 4 1-2 4" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  onde: '<path d="M2 9q2.5-3 5 0t5 0 5 0 5 0M2 14q2.5-3 5 0t5 0 5 0 5 0M2 19q2.5-3 5 0t5 0 5 0 5 0" fill="none" stroke="currentColor" stroke-width="1.7"/>'
};
const icona = (k, col) => `<svg viewBox="0 0 24 24" style="color:${col}" aria-hidden="true">${ICONE[k] || ''}</svg>`;

/* ---------- geometria del mondo ---------- */
const SP = DATI.sport, SPI = Object.fromEntries(SP.map((s, i) => [s.id, i]));
const COL = 210, TW = 180, TH = 76, GAP = 8, TOP = 30, K = 26;
const yAnno = a => TOP + (ULTIMO - a) * K;
const Y1896 = yAnno(DA);
const pre = [...new Set(DATI.voci.filter(v => v.anno < DA).map(v => v.anno))].sort((a, b) => b - a);
const BAND0 = Y1896 + 50, PASSO = 96;
const yVoce = a => a >= DA ? yAnno(a) : BAND0 + 30 + pre.indexOf(a) * PASSO;
const H = BAND0 + 30 + pre.length * PASSO + 60, W = SP.length * COL;

const world = $('world'), stage = $('stage');
world.style.width = W + 'px'; world.style.height = H + 'px';
let html = '';
SP.forEach((s, i) => { html += `<div class="colbg${i % 2 ? ' alt' : ''}" style="left:${i * COL}px;width:${COL}px;height:${H}px"></div>`; });
for (let y = Math.ceil(DA / 10) * 10; y <= ULTIMO; y += 10) html += `<div class="decade" style="top:${yAnno(y)}px;width:${W}px"></div>`;
html += `<div class="band" style="top:${BAND0}px;width:${W}px;height:${H - BAND0}px"><span>Prima del ${DA}</span></div>`;
/* disposizione: una colonna per sport; se due tessere si toccano, la più vecchia scende */
const POS = new Map();
SP.forEach((s, i) => {
  const vv = DATI.voci.filter(v => v.sport === s.id).sort((a, b) => yVoce(a.anno) - yVoce(b.anno));
  let ultimo = -1e9;
  const x = i * COL + 22;
  if (vv.length) html += `<div class="guide" style="left:${i * COL + 10}px;top:${yVoce(vv[0].anno)}px;height:${yVoce(vv[vv.length - 1].anno) - yVoce(vv[0].anno) + 1}px;background:${s.colore}"></div>`;
  vv.forEach(v => {
    const y0 = yVoce(v.anno), y = Math.max(y0 - 14, ultimo + GAP);
    ultimo = y + TH;
    POS.set(v.id, {x, y});
    html += `<div class="pin" style="left:${i * COL + 11}px;top:${y0}px;background:${s.colore}"></div>`;
    if (Math.abs(y + 14 - y0) > 2) html += `<div class="link" style="left:${i * COL + 11}px;top:${y0}px;width:11px;background:${s.colore}"></div>`;
    const anno = v.anno < 0 ? Math.abs(v.anno) + ' a.C.' : (v.circa ? 'circa ' : '') + v.anno;
    html += `<div class="tile" data-id="${v.id}" role="button" tabindex="0" style="left:${x}px;top:${y}px;border-left-color:${s.colore}">` +
      `<div class="y">${anno}</div><div class="t">${esc(v.titolo)}</div>${v.italia ? '<span class="ita" title="Italia"></span>' : ''}</div>`;
  });
});
world.innerHTML = html;
$('heads').innerHTML = SP.map(s => `<div class="head" data-sport="${s.id}" style="border-top-color:${s.colore}" title="${esc(s.nome)}">${icona(s.icona, s.colore)}<b>${esc(s.nome)}</b>${DATI.albi[s.id] ? '<span class="albo">albo</span>' : ''}</div>`).join('');
const HEADS = [...document.querySelectorAll('.head')];
const gut = $('gutter');
const LABELS = [];
for (let y = DA; y <= ULTIMO; y++) { if (y % 5 && y !== ULTIMO && y !== DA) continue; const e = document.createElement('span'); e.textContent = y; e.dataset.y = y; if (y % 50 === 0 || y === DA || y === ULTIMO) e.classList.add('b'); gut.appendChild(e); LABELS.push(e); }

/* ---------- vista: spostamento e zoom ---------- */
const V = {s: 1, x: 0, y: 0};
const HEAD = 44;
const area = () => ({w: stage.clientWidth, h: stage.clientHeight});
const minS = () => Math.min((area().w - 58) / W, (area().h - HEAD) / H);
const maxS = () => 2.2;
function clamp() {
  const {w, h} = area(), sw = W * V.s, sh = H * V.s, L = 58, T = HEAD;
  V.x = sw + L < w ? L + (w - L - sw) / 2 : Math.min(L, Math.max(w - sw - 10, V.x));
  V.y = Math.min(T, Math.max(h - sh - 10, V.y));
}
let raf = 0;
function draw() {
  raf = 0; clamp();
  world.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
  world.classList.toggle('far', V.s < 0.62);
  const cw = COL * V.s;
  HEADS.forEach((e, i) => { e.style.left = (V.x - 58 + i * cw) + 'px'; e.style.width = cw + 'px'; e.querySelector('b').style.display = cw < 74 ? 'none' : ''; const a = e.querySelector('.albo'); if (a) a.style.display = cw < 150 ? 'none' : ''; });
  const passo = V.s * K * 5 < 16 ? (V.s * K * 10 < 16 ? 50 : 10) : 5;
  LABELS.forEach(e => { const y = +e.dataset.y, on = y % passo === 0 || y === ULTIMO; e.style.display = on ? '' : 'none'; if (on) e.style.top = (V.y + yAnno(y) * V.s) + 'px'; });
}
const redraw = () => { if (!raf) raf = requestAnimationFrame(draw); };
function zoomAt(ns, px, py) { ns = Math.max(minS(), Math.min(maxS(), ns)); const k = ns / V.s; V.x = px - (px - V.x) * k; V.y = py - (py - V.y) * k; V.s = ns; redraw(); }
function tutto() { V.s = minS(); V.x = 0; V.y = HEAD; redraw(); }
function inizio() {
  const {w} = area();
  if (w >= 900) { V.s = Math.max(minS(), Math.min(0.9, Math.max(0.78, (w - 58) / W))); V.x = 58; V.y = HEAD; }
  else { V.s = 0.82; V.x = 58 - SPI.basket * COL * V.s + 4; V.y = HEAD; }
  redraw();
}

/* trascinamento, due dita, rotella */
const ptr = new Map(); let moved = false, start = null, pinch = null;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); ptr.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptr.size === 1) { moved = false; start = {x: e.clientX, y: e.clientY, vx: V.x, vy: V.y, t: e.target}; }
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s}; moved = true; }
});
stage.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; ptr.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const r = stage.getBoundingClientRect();
  if (ptr.size === 2 && pinch) { const [a, b] = [...ptr.values()]; zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return; }
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (!moved && Math.hypot(dx, dy) > 6) { moved = true; stage.classList.add('drag'); }
  if (moved) { V.x = start.vx + dx; V.y = start.vy + dy; redraw(); }
});
const fine = e => {
  ptr.delete(e.pointerId); stage.classList.remove('drag');
  if (ptr.size < 2) pinch = null;
  if (ptr.size === 0) { if (!moved && start) { const t = start.t.closest && start.t.closest('.tile'); if (t) apriVoce(t.dataset.id); } start = null; }
};
stage.addEventListener('pointerup', fine); stage.addEventListener('pointercancel', fine);
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  if (e.ctrlKey) zoomAt(V.s * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { V.x -= e.shiftKey ? e.deltaY : e.deltaX; V.y -= e.shiftKey ? 0 : e.deltaY; redraw(); }
}, {passive: false});
stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); zoomAt(V.s * 1.6, e.clientX - r.left, e.clientY - r.top); });
stage.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('tile')) apriVoce(e.target.dataset.id); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#panel')) return;
  const {w, h} = area(), m = {ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80]}[e.key];
  if (m) { V.x += m[0]; V.y += m[1]; redraw(); e.preventDefault(); }
  else if (e.key === '+' || e.key === '=') zoomAt(V.s * 1.25, w / 2, h / 2);
  else if (e.key === '-') zoomAt(V.s / 1.25, w / 2, h / 2);
  else if (e.key === '0') tutto();
  else if (e.key === 'Escape') chiudi();
});
$('bPiu').onclick = () => { const {w, h} = area(); zoomAt(V.s * 1.3, w / 2, h / 2); };
$('bMeno').onclick = () => { const {w, h} = area(); zoomAt(V.s / 1.3, w / 2, h / 2); };
$('bTutto').onclick = tutto;
$('bAlbi').onclick = apriAlbi;
HEADS.forEach(e => e.addEventListener('click', () => apriSport(e.dataset.sport)));
addEventListener('resize', redraw);

/* ---------- scheda ---------- */
const panel = $('panel');
const chip = s => `<button class="chip" type="button" data-sport="${s.id}">${icona(s.icona, s.colore)}${esc(s.nome)}</button>`;
function mostra(htmlBody, hash) {
  panel.innerHTML = `<div class="pin-close"><span></span><button type="button" aria-label="Chiudi" id="bChiudi">×</button></div><div class="body">${htmlBody}<div class="foot">Pilu Sports Almanac · dati aggiornati al ${esc(DATI.aggiornato)}</div></div>`;
  panel.classList.add('open'); panel.scrollTop = 0;
  $('bChiudi').onclick = chiudi;
  panel.querySelectorAll('[data-sport]').forEach(b => b.onclick = () => apriSport(b.dataset.sport));
  panel.querySelectorAll('[data-voce]').forEach(b => b.onclick = () => apriVoce(b.dataset.voce, true));
  if (hash) history.replaceState(null, '', '#' + hash);
}
function chiudi() { panel.classList.remove('open'); document.querySelectorAll('.tile.sel').forEach(t => t.classList.remove('sel')); history.replaceState(null, '', location.pathname); }
const fonti = ff => '<ul class="fonti">' + ff.map(f => `<li><a href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.t)}</a> <span class="ist">· ${esc(f.i)}</span></li>`).join('') + '</ul>';
function apriVoce(id, vai) {
  const v = DATI.voci.find(x => x.id === id); if (!v) return;
  const s = SP[SPI[v.sport]];
  document.querySelectorAll('.tile.sel').forEach(t => t.classList.remove('sel'));
  const el = world.querySelector(`.tile[data-id="${id}"]`); el && el.classList.add('sel');
  if (vai) { const p = POS.get(id), {w, h} = area(); V.x = (w > 700 ? (w - 440) / 2 : w / 2) - (p.x + TW / 2) * V.s; V.y = (w > 700 ? h / 2 : h * 0.18) - (p.y + TH / 2) * V.s; redraw(); }
  const quando = v.data || (v.anno < 0 ? Math.abs(v.anno) + ' a.C.' : (v.circa ? 'circa ' : '') + v.anno);
  mostra(`${chip(s)}<h2>${esc(v.titolo)}${v.italia ? '<span class="flag">ITALIA</span>' : ''}</h2>
    <div class="meta">${esc(quando)}${v.luogo ? ` <span class="luogo">· ${esc(v.luogo)}</span>` : ''}</div>
    <p>${esc(v.testo)}</p>
    ${v.nota ? `<div class="nota">${esc(v.nota)}</div>` : ''}
    <h3>Fonti</h3>${fonti(v.fonti)}
    ${DATI.albi[v.sport] ? `<p><button class="chip" type="button" data-sport="${s.id}">Albo d'oro di ${esc(s.nome.toLowerCase())} →</button></p>` : ''}`, 'voce=' + id);
}
function tabella(a, k) {
  const t = a.tornei[k];
  return `<table class="albo"><colgroup><col class="c-a"><col><col class="c-r"><col><col></colgroup><thead><tr><th>Anno</th><th>Oro</th><th>Finale</th><th>Argento</th><th>Bronzo</th></tr></thead><tbody>` +
    t.righe.slice().reverse().map(r => `<tr class="${[r.oro, r.argento, r.bronzo].some(x => x.includes('Italia')) ? 'ita' : ''}"><td class="a">${r.anno}<span class="sede">${esc(r.sede)}</span></td><td>${esc(r.oro)}</td><td class="r">${esc(r.ris)}</td><td>${esc(r.argento)}</td><td>${esc(r.bronzo)}</td></tr>`).join('') + '</tbody></table>';
}
function apriSport(id, k = 0) {
  const s = SP[SPI[id]], a = DATI.albi[id];
  const vv = DATI.voci.filter(v => v.sport === id).sort((x, y) => y.anno - x.anno);
  let corpo = `${chip(s)}<h2>${esc(s.nome)}</h2>`;
  if (a) corpo += `<h3>${esc(a.titolo)}</h3><div class="tabs">${a.tornei.map((t, i) => `<button type="button" data-k="${i}" class="${i === k ? 'on' : ''}">${esc(t.nome)}</button>`).join('')}</div>${tabella(a, k)}
    <div class="nota">In verde le edizioni con l'Italia sul podio. ${esc(DATI.nota_albi)}</div><h3>Fonti dell'albo d'oro</h3>${fonti(a.fonti)}`;
  else corpo += `<div class="nota">Albo d'oro non ancora inserito per questo sport.</div>`;
  corpo += `<h3>Le tessere (${vv.length})</h3><ul class="lista">${vv.map(v => `<li data-voce="${v.id}"><span class="ly">${v.anno < 0 ? Math.abs(v.anno) + ' a.C.' : v.anno}</span><span>${esc(v.titolo)}</span></li>`).join('')}</ul>`;
  mostra(corpo, 'sport=' + id);
  panel.querySelectorAll('.tabs button').forEach(b => b.onclick = () => apriSport(id, +b.dataset.k));
}
function apriAlbi() {
  mostra(`<h2>Albi d'oro</h2><p>Medaglie olimpiche, edizione per edizione.</p><div class="albi-lista">` +
    Object.entries(DATI.albi).map(([id, a]) => { const s = SP[SPI[id]]; return `<button type="button" data-sport="${id}">${icona(s.icona, s.colore)}<span><b>${esc(s.nome)}</b><br><small>${esc(a.titolo)}</small></span></button>`; }).join('') + '</div>', 'albi');
}

/* ---------- avvio ---------- */
inizio();
function daIndirizzo() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('voce')) apriVoce(h.get('voce'), true); else if (h.get('sport')) apriSport(h.get('sport')); else if (location.hash === '#albi') apriAlbi();
}
daIndirizzo();
addEventListener('hashchange', daIndirizzo);
setTimeout(() => $('hint').classList.add('off'), 6000);
</script>
</body>
</html>
